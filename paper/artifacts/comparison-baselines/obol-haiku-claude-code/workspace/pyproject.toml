[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-dashboard"
version = "0.1.0"
description = "TUI dashboard for managing personal finances"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
