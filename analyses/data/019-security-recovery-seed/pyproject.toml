[project]
name = "auth-service"
version = "0.1.0"
description = "Application authentication service — login, sessions, baseline coverage. Pre-seed for the T37 security-recovery showcase."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "bcrypt>=4.0",
    "pydantic>=2.0",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
