[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wonderland-ai"
version = "0.3.5"
description = "An identity-native multi-agent development system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Daedalus", email = "kohlbern@gmail.com" },
]
keywords = ["agents", "multi-agent", "anthropic", "claude", "identity"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.10",
    "python-ulid>=3.0",
    "aiosqlite>=0.20",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    # Textual is the primary user-facing surface — wonderland-tui
    # is what most users will interact with. Promoted from the
    # [tui] extra to a core dep in 0.1.0. Theme API requires v8+.
    "textual>=8.0",
    "plotext>=5.3.2",
]

[project.urls]
Homepage = "https://github.com/KohlJary/wonderland-ai"
Repository = "https://github.com/KohlJary/wonderland-ai"
Issues = "https://github.com/KohlJary/wonderland-ai/issues"
Documentation = "https://github.com/KohlJary/wonderland-ai/blob/main/WONDERLAND_SPEC.md"

[project.scripts]
wonderland = "wonderland.cli:main"
wonderland-tui = "wonderland.tui.app:main"

[project.optional-dependencies]
redis = [
    "redis>=5.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "redis>=5.2",  # full test coverage includes the Redis path
]

[tool.hatch.build.targets.wheel]
packages = ["src/wonderland"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts in tests are fine

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
