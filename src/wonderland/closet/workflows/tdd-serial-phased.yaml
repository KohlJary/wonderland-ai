name: tdd-serial-phased
description: |
  Phased variant of tdd-serial — adds MtG-style phases + priority
  rotation to M3, M4, M5, M6 (analysis 033 / P9 T59). Same meeting
  shape as tdd-serial but with structural rotation caps that bound
  Hatter sprawl and Tweedle iteration via the engine rather than via
  per-directive bounds. M1, M2, M2.5 stay phase-free — those meetings
  weren't sprawl loci in 032 and don't need the structural cap.

  The first opt-in run for the P9 phased orchestrator. A/B against
  the 032 banner ($4.7236, 1080 LOC, 10 test files, 465 calls,
  ~28 min wall-clock) using the same Pomodoro directive. Headline
  metric: Hatter call count drops without test quality dropping.

  Rotation budgets calibrated from 032 telemetry:
  - M3: 19 calls / 5 turns per Tweedle → 3 rotations (cast=2, max 6
    deliberations) gives clean negotiation room.
  - M4: 54 calls/iteration ≈ 13 deliberations/agent → 1 rotation
    clarify + 3 rotations red-tests (cast=4, max 16 deliberations).
    Hatter's primary sprawl locus per analyses 029-032; this is
    where the experiment lives.
  - M5: 56 calls/iteration ≈ 28 deliberations/Tweedle → 4 rotations
    implement (cast=2, max 8 deliberations). Aggressive cap relative
    to 032; the bet is that the iterate-red-green loop tightens with
    fewer deliberations because each window pressures more tool work.
  - M6: 99 calls / 27 turns/agent → 2 rotations review + 2 defend
    (cast=3, max 12 deliberations). Trial structure naturally
    splits into "Caterpillar surfaces findings" then "Tweedles
    respond"; phases formalize that.

  Other than ``phases:`` (and ``team_groupings:`` after T64) additions,
  the YAML is identical to tdd-serial. Original tdd-serial stays as
  the legacy 032 baseline — switch workflow names to A/B without
  code archaeology.

  Team partition (analysis 034 F2 / P9.5 / T65) maps constitutional
  pairs onto MtG-style team windows: members of the same team
  deliberate concurrently within one team window via asyncio.gather,
  recovering the parallelism r35 lost to strict-serial priority.

    - M3:  [[tweedledee, tweedledum]]
    - M4:  [[alice, mad_hatter], [tweedledee, tweedledum]]
    - M5:  [[tweedledee, tweedledum]]
    - M6:  [[caterpillar], [tweedledee, tweedledum]]

  Solo Caterpillar in M6 is a degenerate single-member team — the
  team-window primitive collapses to one priority window at a time
  for solo teams. The role split (Caterpillar leads in review,
  Tweedles lead in defend) is implicit in the convenor directive;
  team_groupings formalizes the partition for the orchestrator.

  Serial variant of the TDD workflow: M4 (test scenarios) and M5
  (implementation) loop per feature instead of fanning across all
  features at once. Same M1/M2/M2.5/M3 setup; M6 still reviews the
  combined working tree at the end.

  The hypothesis (from analysis 029's pattern + the cost trajectory
  in analyses 026-030):

    - **Cache locality**. Each per-feature M4/M5 has a tiny payload
      (one feature's spec, one feature's contracts) versus the full
      fan-out. Haiku's caching threshold is ~7K tokens of cached
      prefix; a per-feature iteration's seed envelope is dramatically
      smaller than the full-feature-set seed.

    - **Focused attention**. Hatter writes scenarios for one feature
      at a time — no scope sprawl across six. Tweedles implement one
      feature, ship, move on. Both characters' §VIII failure modes
      (Hatter scenario sprawl, Tweedle dance / contract drift) get
      less surface area to manifest on.

    - **Composability primitive**. The ``per_item: feature`` annotation
      is the foreach Wonderland needs anyway. Once it exists, the TUI
      can let users batch features for one run or run them one-at-a-
      time, and future workflows can reach for ``while`` / conditional
      steps. This workflow is the first proof.

  How it works:

    - M1, M2, M2.5, M3 run once each, identical to canonical TDD.
      M2.5 ships the feature manifest; M3 ships the cross-feature
      contracts.
    - M4 runs once per feature. Iteration N's thread_id is
      ``test-scenarios-{feature.slug}``; iteration N sees only
      feature N + the contracts touching feature N (sliced from
      the same M3 contract set).
    - M5 runs once per feature. Iteration N's thread_id is
      ``implementation-{feature.slug}``; iteration N seeds from
      M4 iteration N's outputs (the test files for feature N) and
      feature N's spec.
    - M6 runs once at the end, reviewing the combined working tree
      across all features.

  Tradeoffs vs the parallel-fan-out tdd workflow:

    - **More overhead from convene cycles**: each iteration pays
      the convenor cost (Dodo's directive relay). With 6 features
      that's 12 convenes vs 2 in the parallel version. Net cost is
      still expected to drop because the per-iteration payloads
      are so much smaller, but observable.
    - **No cross-feature context within M4/M5**: Hatter writing
      scenarios for feature N doesn't see what he wrote for
      features 1..N-1. M6 catches anything that needs cross-feature
      coordination. Acceptable in v1 because cross-feature concerns
      mostly live in M3 (contracts) and M6 (review).
    - **Contract drift risk**: if feature N's M5 realizes the M3
      contract needs adjustment, the v1 answer is "raise as a
      Tweedle concern; M6 catches it". Partial M3 re-runs are v2.

  Use this for: feature-rich projects where each feature is mostly
  independent of the others (e.g. a Pomodoro tracker's separate
  features for sessions, breaks, history, settings). For projects
  where features tightly co-evolve, the parallel ``tdd`` workflow
  may produce better cross-feature consistency at the cost of fan-
  out attention.

version: 1

defaults:
  # Lower than parallel tdd — per-iteration payloads are smaller and
  # the inner loops cache better. Watch the actual telemetry; if a
  # run blows past this we revise.
  budget_dollars: 5.00
  quiescence_seconds: 300.0

meetings:
  # M1, M2, M2.5, M3 are identical to tdd.yaml — feature manifest +
  # cross-feature contracts. Only M4 and M5 change shape.

  - id: scoping
    label: M1
    name: The Caucus Race
    goal: produce user stories + an architectural ADR + GDPR rulings
    roster: [alice, cheshire_cat, queen_of_hearts]
    meeting_budget: 0.40
    seeds: []

  - id: decomposition
    label: M2
    name: The Rabbit's Errand
    goal: decompose the ADR + stories into v1 tickets, with the user-facing point preserved
    roster: [alice, white_rabbit, cheshire_cat]
    meeting_budget: 0.40
    convenor_directive: |
      Decomposition thread. The stories and ADR(s) in your context
      are settled — they were produced in a prior scoping thread.
      Read them as locked context, not as fresh proposals to respond
      to.

      **Rabbit, your move is `ticket`:** decompose the user-story-
      and-architecture picture into v1-scope work units the Tweedles
      can pick up.

      **Cat:** weigh in only if a ticket implies a fresh architectural
      decision the existing ADRs don't cover.

      **Alice — you're here as the grounding voice.** You wrote the
      stories Rabbit is decomposing; your job in this thread is to
      defend them when Rabbit's tickets compress them past user-
      recognition, and to ask "would the persona I named actually
      care about this?" when a ticket drifts toward technical
      convenience. You are not driving the decomposition; you are
      defending the user-facing point of it. Default to silence
      unless the work is drifting from a story your persona would
      recognize.
    seeds:
      - from: scoping
        kinds: [adr, story]

  - id: composition
    label: M2.5
    name: Advice from a Caterpillar
    goal: group v1 tickets into user-facing features that span the stack coherently
    roster: [alice, white_rabbit, caterpillar]
    meeting_budget: 0.40
    convenor_directive: |
      **Rabbit, ship features.** This is your meeting — the chapter
      title (Caterpillar's chapter) describes the *stance* the team
      takes in this thread, not who's driving. You are. Read the
      tickets in your context and group them into user-facing
      features. A feature is a capability a user can describe in
      one sentence; it aggregates multiple tickets that ship
      together as a coherent thing. **Silence is wrong here — your
      job is to produce features.** The decomposition work already
      happened in the prior thread (the Rabbit's Errand); this
      thread is the composition work that hands off to the
      Tweedles. Without features, M3 has nothing to negotiate
      against and the rest of the pipeline degrades.

      For every feature you ship, name:
      - `stack_span` — frontend / backend / full-stack. Tweedles
        use this in M3 to decide whether both sides need to align
        on the seam or just one.
      - `personas` — at least one persona name from the M1 stories
        that this feature serves. If you can't name a persona, the
        grouping isn't a feature, it's a bag of tickets.
      - `tickets` — the ticket slugs this feature aggregates.
      - `tier` — v1 / fast-follow / post-launch. Tier the feature
        separately from its constituent tickets. A feature can be
        deferred to fast-follow even when its underlying tickets
        stay v1 (the ticket is the unit of work; the feature is
        the unit of user-facing framing).

      You don't need to be perfect — half-formed groupings are
      better than silence. Alice and Caterpillar will push back
      if you've drifted; revise from there.

      **Note for this workflow specifically (tdd-serial):** each
      v1 feature you ship will get its OWN M4 and M5 thread
      downstream, in serial. Smaller, more granular features
      produce more iterations but each iteration is cheaper and
      more focused. Don't pre-optimize the iteration count;
      group naturally.

      **Alice — same grounding role as M2.** Audit feature claims
      against your stories. Push back when a feature has drifted
      from a story your persona would recognize, or when a story
      you wrote has no feature serving it (dropped on the floor in
      the grouping). Default to silence unless a grounding
      intervention is needed.

      **Caterpillar — apply your "who are you?" stance one layer
      earlier than M6.** For each feature Rabbit ships, ask: what
      does this claim, and do its constituent tickets actually
      deliver that? You're reviewing the *promise* the feature
      makes, not shipped code. Speak when a feature's claim is
      incoherent with its tickets, or when its tickets aggregate
      something that isn't a coherent capability the user would
      name. Default to silence otherwise.

      Don't add tickets, don't remove tickets, don't re-litigate
      scope. Group what's there.
    seeds:
      - from: scoping
        kinds: [adr, story]
      - from: decomposition
        kinds: [ticket]

  - id: contract-negotiation
    label: M3
    name: Tweedledum and Tweedledee
    goal: negotiate contracts the Tweedles will implement against
    roster: [tweedledee, tweedledum]
    meeting_budget: 0.80
    convenor_directive: |
      Contract negotiation thread. The ADR(s) and features in your
      context are settled — read them as locked. Tweedledee,
      Tweedledum: this is the pair's design work. **Do NOT call
      write_file in this thread.** The codebase is not yet in scope
      — you are designing the seam, not shipping. Hatter writes
      failing tests against your contracts in the next phase, then
      implementation happens.

      Each feature in your context names a `stack_span`:
      - `full-stack` features: both of you negotiate the seam
        together. The contract spans frontend ↔ backend — surface
        what each side promises and consumes.
      - `frontend` features: Tweedledee leads; Tweedledum confirms
        no backend impact (or names the impact if there is one).
      - `backend` features: Tweedledum leads; Tweedledee confirms
        no frontend impact.

      **Note for this workflow (tdd-serial):** M4 and M5 will run
      once per feature in serial. Each per-feature iteration sees
      only its feature's contract notes. Contracts that span
      multiple features (e.g., a session-state contract that
      sessions, breaks, and history all consume) should be tagged
      in the `feature` field of the contract note as the feature
      that owns it. Cross-feature contract drift is a v2 concern;
      for now, Tweedles in a per-feature M5 iteration who realize
      a contract needs to adjust should raise it as a `concern`
      and let M6 catch it.

      Draft the contract notes that nail down the seams. Half-formed
      is fine (state=proposed); your sibling fills in their side.
      Reach `state=agreed` on the load-bearing contracts before this
      meeting closes — Hatter writes tests against agreed contracts
      only.
    seeds:
      - from: scoping
        kinds: [adr]
      - from: composition
        kinds: [feature]
    # Single phase, single team — Tweedles are constitutionally
    # paired (frontend/backend complementary split), not adversarial
    # competitors. team_groupings collapses what would have been 2
    # serial windows per rotation into 1 team window where both
    # deliberate concurrently via asyncio.gather. Wall-clock for
    # M3 should drop ~halfway toward 032's pre-phase baseline.
    phases:
      - name: discussion
        max_rotations: 3
        team_groupings:
          - [tweedledee, tweedledum]

  # ---------------------------------------------------------------------
  # M4 — per-feature test scenarios. Iteration N convenes with the
  # thread_id ``test-scenarios-{feature.slug}``. Each iteration sees
  # only feature N + contracts touching feature N. The agents stop
  # writing tests when feature N's surface is covered; cross-feature
  # invariants are M6's job.
  # ---------------------------------------------------------------------
  - id: test-scenarios
    label: M4
    name: The Mad Tea Party
    goal: produce failing test scenarios + test files (user journeys + failure modes) for the feature in this iteration
    roster: [alice, mad_hatter, tweedledee, tweedledum]
    # Lower per-iteration budget — each iteration's payload is much
    # smaller than the parallel-fan-out version's.
    meeting_budget: 0.50
    per_item: feature
    convenor_directive: |
      Test-scenarios thread — the tea party, scoped to ONE feature.
      Your context contains exactly one feature, and the contract
      notes touching that feature. Alice and Hatter, this is the
      pair's work: between you, you pin the test surface that this
      feature's M5 implementation has to satisfy.

      **Calibrate the number of scenarios to the feature's surface
      area, not to the abstract space of imaginable bugs.** A
      feature with a single user action wants a small handful of
      happy-path + a small handful of fragility scenarios. A
      feature with multiple state transitions, persistence, or
      cross-system effects wants more. The right scenario count
      emerges from the feature itself; it is not a function of how
      many edge cases you can imagine. Bounded reasoning is the
      right shape for this meeting; sprawling is the failure mode.

      **Stay scoped to the feature in your context.** This is not
      M4-for-the-whole-system — this is M4 for THIS feature. Stop
      when the feature's surface is covered; don't generalize to
      invariants that span features. Caterpillar's review in M6
      is the cross-feature-invariants safety net, and the next
      M4 iteration handles the next feature.

      **Alice's move** — user-journey scenarios for this feature.
      A real persona from your M1 stories, the sequence of actions
      they take, the observable result. One scenario is the floor;
      ship more only if this feature has genuinely distinct user
      paths. The WHO-IS-THIS-FOR test for THIS feature.

      **Hatter's move** — failure-mode scenarios for this feature.
      The load-bearing edge cases that match its failure-mode
      profile (security, concurrency, malformed input, the things
      that look fine on the happy path and break on the second
      Tuesday in March). Match the feature's stack_span: full-stack
      features need both halves; one-sided features need only
      their side.

      **Self-audit each scenario before you ship it.** Before
      emitting any scenario artifact, run it past three questions:

      1. Would this test, if it failed, surface a bug an actual
         user would notice in their use of *this* feature?
      2. Does an earlier scenario in this thread already pin the
         same behavior or catch the same class of bug?
      3. Is this scenario describing a real failure mode for
         *this* feature, or a generic edge case I'd ship for any
         feature?

      If you can't say yes to question 1 — or if either of 2 or 3
      is yes — don't ship the scenario. **Skipping a scenario is a
      healthy move; sprawling is the failure mode.** This applies
      to both Alice's user-journey scenarios and Hatter's failure-
      mode scenarios.

      **CRITICAL: each of you must do TWO things per scenario, not
      one.** A scenario without a runnable test file is documentation,
      not a test. M5 cannot turn a markdown artifact red→green; it
      can only turn a `.py` file red→green.

      For EVERY scenario you ship:

      1. Emit the `story` (Alice) or `test_scenario` (Hatter)
         artifact via the structured response.

      2. **AND** call `write_file` on `tests/test_<feature_slug>_<axis>.py`
         (use the feature's slug as the file name anchor; one file
         per axis when scenarios are tightly grouped, multiple files
         when they're not). The test should FAIL right now (no
         production code exists yet); use `pytest.skip`,
         `pytest.xfail`, or import-from-modules-that-don't-exist-yet.

      Skipping step 2 is the most common failure mode of this
      meeting. If you finish your turn and `tests/` has no new files
      for this feature, you have not done your job.

      Read `tests/conftest.py` first (use `read_file`) to understand
      the existing pytest fixtures and conventions; the test files
      you write should plug in.

      **Tweedledee and Tweedledum — your M4 contribution is bounded
      and reactive, not proactive.** This thread is Alice and
      Hatter's pair work. Your role is to answer their questions if
      they ask, and — at most ONCE per iteration, only if needed —
      raise a `concern` about a contract gap that genuinely blocks
      M5's ability to make this feature's tests pass. Examples of
      genuinely-blocking gaps: a state transition the test exercises
      that no contract names; a payload field the test asserts on
      that the contract doesn't define; an error path the test
      describes that the contract is silent on.

      **Bound your concerns to ONE per iteration.** If you find a
      second potential gap, sit with it — most contract gaps surface
      cleanly in M5 when you actually start implementing, and M5
      already has an explicit "raise as a concern, don't silently
      work around it" escape valve for exactly this. Surfacing every
      ambiguity preemptively in M4 expands the meeting without
      proportional benefit; M5 is the natural place to discover what
      the implementation actually needs.

      **Do NOT call `write_file` in this thread — at all.** No
      production code, AND no test files. Test authorship is Alice
      and Hatter's domain in this meeting; if you see a test surface
      gap, raise it as a concern (within your one-per-iteration
      budget) and let them write it. M5 is your turf for shipping
      both implementation AND any complementary tests that
      implementation reveals are needed. This thread, you read and
      respond.

      **Hatter — stay in your lane.** Two things you do NOT do:

      1. **Don't iterate on meta-discussion.** If you observe
         process issues mid-meeting, raise ONE `concern` and move
         on. Do not re-litigate.
      2. **Don't write production code.** No `write_file` calls
         outside `tests/` (the test files you author) and
         `.wonderland/`. Production code is M5's job.

      Per analysis 029 F5 + 030 + 031 F3-F4: your §VIII failure mode
      (scenario sprawl + severity inflation) generalizes to
      meta-discussion sprawl AND out-of-lane code shipping AND
      category-breadth sprawl within a single feature. The
      surface-relative + self-audit clauses above are the bound on
      that last shape.
    seeds:
      - from: scoping
        kinds: [adr, story]
      - from: composition
        kinds: [feature]
      - from: contract-negotiation
        kinds: [contract_note]
        where:
          state: agreed
        fallback: any
    # Two phases, two teams per phase — Alice and Hatter are the
    # Tea Party's complementary pair (user-journey + failure-mode);
    # Tweedles are the bounded-reactive observers. With 2-of-2
    # teams, each rotation has 2 team windows; deliberations within
    # each team run concurrently via asyncio.gather. Wall-clock cost
    # drops roughly half vs r35's strict-serial 4-agent rotation.
    phases:
      - name: clarify
        max_rotations: 1
        team_groupings:
          - [alice, mad_hatter]
          - [tweedledee, tweedledum]
      - name: red-tests
        max_rotations: 3
        team_groupings:
          - [alice, mad_hatter]
          - [tweedledee, tweedledum]

  # ---------------------------------------------------------------------
  # M5 — per-feature implementation. Iteration N convenes with the
  # thread_id ``implementation-{feature.slug}``. Each iteration sees
  # feature N + M4 iteration N's tests + contracts touching feature N.
  # The closure criterion: this feature's tests turn red→green.
  # ---------------------------------------------------------------------
  - id: implementation
    label: M5
    goal: implement to make this feature's failing tests pass (red → green for THIS feature)
    roster: [tweedledee, tweedledum]
    meeting_budget: 0.50
    per_item: feature
    convenor_directive: |
      Implementation thread, scoped to ONE feature. Your context
      contains exactly one feature, the test scenarios + test files
      written for it in the prior thread, and the contracts touching
      it. Read the test files via `read_file` (look in tests/) so
      you know the closure criterion FOR THIS FEATURE. Your move is
      `implementation`. **Call `write_file` to ship production code**
      that turns this feature's red tests green.

      The cycle is red → green → refactor. You're in the green step
      for this feature. Don't refactor the tests; if a test is wrong,
      raise a `concern` — but default assumption is the tests describe
      correct behavior.

      **Stay scoped to this feature.** Don't try to ship code for
      other features that haven't run their M5 yet — they get their
      own iteration. If implementing this feature requires touching
      shared infrastructure (e.g., a router registration), do the
      minimum needed to make THIS feature's tests pass and let the
      next iteration extend the same shared file.

      **The codebase ALREADY EXISTS in the working tree** — the
      project skeleton is laid down before the run, and prior
      iterations may have already shipped code for earlier features.

      **MANDATORY first move: call `list_files` on the project root**
      before any `write_file`. The skeleton's directory layout is
      authoritative — do NOT invent new top-level directories. If
      the skeleton has `frontend/src/`, frontend code goes there;
      do not create `src/frontend/`. If it has `src/backend/`, backend
      code goes there; do not create `backend/`. New files extend
      the existing tree, never replace it.

      After `list_files`, use `read_file` on the key files in your
      domain (frontend → `frontend/src/App.tsx`, `frontend/src/api.ts`;
      backend → `src/backend/models.py`, `src/backend/api/`). If
      previous iterations shipped code, read what's there before
      adding to it — don't duplicate routes, models, or imports
      another feature's iteration already established.

      **Skeleton TEMPLATE markers — read carefully.** The skeleton
      ships with a working hello-world example. These files are
      marked `SKELETON TEMPLATE — REPLACE OR DELETE`. Half-replacement
      breaks the import chain — pytest fails to collect ANY tests
      because conftest.py imports the broken chain, and all your
      real test signal disappears. Each TEMPLATE comment block names
      exactly which other files need updating; follow the
      instruction.

      Tweedledee owns frontend; Tweedledum owns backend.

      **Iterate red→green using `run_tests`.** This is the load-
      bearing loop: ship code with `write_file`, run the relevant
      tests with `run_tests` (scope to the test files for THIS
      feature), read what's still failing, fix and repeat. Without
      this loop you ship blind.

      **If `run_tests` reports `BUILD FAILURE` (collection error /
      import error), STOP shipping new code and fix the import chain
      first.** A build failure hides ALL test signal — every other
      test in the project becomes invisible. Common cause: you
      replaced or deleted a file that's still being imported
      elsewhere. Read the offending file, remove the stale import,
      run tests again to confirm.

      Use `paths=['tests/test_<this_feature_slug>_*.py']` to scope
      to the feature you're working on. Don't run the full suite
      until your feature is green; you'll get noise from earlier
      features (they're done) and later features (their tests are
      red because they haven't been implemented yet).

      A test that passes when it should fail, or fails when it
      should pass, is a `concern` to raise — don't silently change
      the test.

      Closure: every test for THIS feature has matching production
      code. The `run_tests` summary line for the scoped path is
      the literal signal of done: when it reports zero failures
      for this feature's tests, you're done. Cross-feature
      regressions are M6's job to surface.

      **Production code lives in non-test directories. Test fixtures
      are NOT production code.** Per analysis 036's no-production-
      code regression: tests that pass against an in-test-fixture
      implementation are not a green meeting. The closure criterion
      is "tests green AND the production code that satisfies them
      lives in src/ (or the project skeleton's equivalent — frontend/
      src/, src/backend/, etc.) where someone running the app can
      import it." If your tests pass because you inlined the logic
      in `tests/conftest.py` or another test fixture, you have not
      shipped a feature; you have shipped a sophisticated test
      double. The `implementation` artifact you emit must name
      `files_touched` paths in non-test locations; if every
      `files_touched` entry is under `tests/`, you are not done
      and should keep iterating until production code materializes.

      **The skeleton-or-equivalent rule, even when no skeleton was
      imposed.** When the project root is bare (no pre-laid skeleton),
      the convention is: production Python under `src/`,
      production frontend under `frontend/src/` or `web/`, with
      `tests/` reserved for test files only. Pick a location and
      ship the production module there; don't write production
      logic in conftest.py for "convenience."

      **Contract drift escape valve:** if implementing this feature
      reveals that an M3 contract needs adjustment (e.g., a state-
      machine boundary that didn't show up until implementation),
      raise it as a `concern` rather than silently working around
      it. M6 catches contract drift; partial M3 re-runs are v2.
    seeds:
      - from: scoping
        kinds: [adr]
      - from: composition
        kinds: [feature]
      - from: contract-negotiation
        kinds: [contract_note]
        where:
          state: agreed
        fallback: any
      - from: test-scenarios
        kinds: [test_scenario, story]
    # Single phase, single team — same constitutional pairing as
    # M3, applied to the iterate-red-green loop. Tweedledee:frontend
    # + Tweedledum:backend deliberate concurrently inside each
    # team window; per-window tool loop (read_file → write_file →
    # run_tests → repeat) still runs unbounded inside each
    # deliberation. Wall-clock recovery is meaningful here because
    # M5 iterates 5× per_item across features.
    phases:
      - name: implement
        max_rotations: 4
        team_groupings:
          - [tweedledee, tweedledum]

  # ---------------------------------------------------------------------
  # M6 — single review meeting at the end. Sees the combined working
  # tree across all features; surfaces cross-feature invariants and
  # per-feature claim integrity that the per-feature M5s couldn't see.
  # ---------------------------------------------------------------------
  - id: review
    label: M6
    name: The Trial
    goal: Caterpillar reviews the shipped code across all features; surface findings
    roster: [caterpillar, tweedledee, tweedledum]
    meeting_budget: 1.20
    convenor_directive: |
      Review thread. Code was shipped across multiple per-feature
      implementation threads to make their tests pass. Caterpillar:
      the working tree IS the implementation artifact — call
      `git_status` to see what shipped across all features, then
      `git_diff` to read the changes. Surface findings on the
      production code itself, citing files and lines.

      **First check before any code-level review: did production
      code actually ship to a non-test location?** Per analysis 036:
      a previous run shipped 0 LOC of production code while test
      suites passed against in-fixture implementations. Run
      `list_files src/` (or the project skeleton's equivalent
      production directory) before reading any single file. If the
      production directory is empty or contains only stubs while
      `tests/conftest.py` (or similar) holds substantial
      implementation logic, that's the load-bearing finding to
      surface — an `implementation` artifact that names where the
      production code SHOULD have been, with a `concern`
      severity that escalates above the per-feature claim-
      integrity reviews. Do not soften this finding with "but the
      tests pass" — passing tests against fixture-resident logic
      is process discipline at the expense of the deliverable.
      Tests-pass-fixture is *not* a green run; it is a sophisticated
      red run.

      **Two layers of review land naturally on you in this serial
      workflow:**

      - **Per-feature claim integrity** — for each feature, does
        the shipped code actually deliver what the feature claims?
        Apply your "what does this code claim, and does the claim
        hold?" stance with the feature's user-facing promise as
        the anchor.

      - **Cross-feature consistency** — this layer is especially
        load-bearing in the serial workflow because per-feature
        M4/M5 iterations CAN'T see each other. If feature A and
        feature B both touch the same shared file (router
        registration, state model, schema), did they cohere or
        did each iteration handle it independently in a way that
        produces inconsistencies? This is the system-wide
        invariants check.

      You can also `read_file` the test files if a finding hinges
      on whether the code matches test intent — but don't critique
      the tests themselves; they were locked in M4 and made green
      in M5.

      Tweedles: respond to findings; if a finding implies a code
      change you agree with, ship the fix via `write_file` and
      re-emit an `implementation` utterance. Do not re-litigate
      the contracts or the tests; both are locked.

      **Bound your fix-on-review work to genuinely-broken bugs.**
      Don't accept every finding as actionable. If Caterpillar's
      finding is a refactor suggestion or "could be improved" —
      not a name-the-broken-behavior bug — push back as a
      `concern` rather than shipping the refactor. M6's job is
      *closure on named bugs*, not perfection. Speculative
      refactors during review are scope creep. (Per analysis 029
      F5: bound the iteration, ship what's load-bearing, let the
      rest go to a future pass.)
    seeds:
      - from: composition
        kinds: [feature]
      - from: implementation
        kinds: [implementation]
    # Two phases — review is Caterpillar surfacing findings,
    # defend is Tweedles responding. Two teams per phase: solo
    # Caterpillar + paired Tweedles. The role split (Caterpillar
    # leads in review, naturally passes in defend; Tweedles
    # naturally pass in review, lead in defend) is implicit in the
    # convenor directive — the team partition formalizes it. Solo
    # teams just open one window at a time (degenerate case of the
    # team-window primitive); the Tweedle pair deliberates
    # concurrently within their team window.
    phases:
      - name: review
        max_rotations: 2
        team_groupings:
          - [caterpillar]
          - [tweedledee, tweedledum]
      - name: defend
        max_rotations: 2
        team_groupings:
          - [caterpillar]
          - [tweedledee, tweedledum]
