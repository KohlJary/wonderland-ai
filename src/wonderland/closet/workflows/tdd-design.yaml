name: tdd-design
description: |
  Design-phase atom of the TDD pipeline. Produces designed features —
  features with constituent tickets, an architectural commitment, and
  per-feature contracts — but does not implement them. Operator runs
  this phase, reviews the designed features, picks which to queue for
  implementation, then runs tdd-implement (the implement-phase atom)
  separately.

  The split exists for cost-of-iteration reasons: design runs are
  ~$0.50–$2 territory; implementation is $5–$15. Being able to
  iterate design 5–10× before committing implementation budget is a
  structural change in the cost curve. Cross-run continuity (the
  seed-fallback shipped in 0.3.0) means refined ADRs and stories
  from prior design runs carry forward, so iterating design on the
  same project is meaningful work, not redundant regeneration.

  ## Order rationale (analysis 040)

  Stories → features → tickets → architecture → contracts. Two
  changes vs the previous tdd-serial-phased shape:

  1. **Features come BEFORE tickets** (was the other way around).
     Tickets are implementation atoms; features are user-meaningful
     capabilities. Going stories → features → tickets matches how
     product → engineering decomposes work in real teams. The
     previous order (tickets first, features composed from them)
     led to monolithic-feature collapse in r43-obol — Rabbit lumped
     six tickets into one feature because the grouping was post-hoc
     rationalization. Features-first means natural cleavage and
     stable per-feature ticket granularity.

  2. **Architecture + security come AFTER feature/ticket generation**
     (was Cat alongside Alice in M1). Cat architecting from concrete
     features + tickets produces grounded ADRs (see r42-obol's
     ADR-002 — "three backend domains" was grounded in personas).
     Cat architecting from stories alone (r41-obol's ADR-001) is
     more abstract and less actionable. Same logic for the Queen's
     security pass — concrete material to threat-model against.

  Hatter doesn't appear in this workflow. Tea Party (Hatter writing
  failing tests) is part of TDD's red-green loop and lives in
  tdd-implement, not here. Designed features ship without test
  scenarios; the implementation phase generates failing tests +
  passing implementation as a paired loop per ticket.

  ## Output

  - User stories (Alice's M1 work)
  - Features grouped by user-meaningful capability
  - Tickets per feature (implementation atoms with stack_span tier)
  - One or more ADRs (architectural commitments)
  - Zero or more security rulings (Queen's threat-model output)
  - Contract notes per feature (Tweedles' negotiated seams)
  - Features end up in lifecycle state ``designed``

  ## A/B baseline

  When tdd-implement runs against features designed by this workflow,
  the per-iteration payloads should be tighter than tdd-serial-phased
  (no scenario sprawl mid-design; each meeting focused on one job).
  Watch r-obol-design-vs-monolithic for the comparison.

version: 1

# Block speech_acts that belong to other workflows. ``milestone_plan``
# is the canonical example: discovery4's pilot showed Rabbit shipping
# a stray milestone_plan utterance mid-design that overwrote M1's
# consumes_requirements with invented slugs, breaking the
# realization chain. interview_* are the discovery workflow's
# decisions — they don't make sense in design either. The substrate
# strips artifacts of these speech_acts at publish time (same shape
# as the meeting-level allowed_decisions filter), so an agent who
# pattern-matches to the wrong workflow's primary decision can't
# corrupt the registry.
disallowed_decisions:
  - milestone_plan
  - interview_questions
  - interview_review

defaults:
  budget_dollars: 3.00
  quiescence_seconds: 300.0

meetings:

  # ─────────────────────────────────────────────────────────────────
  # M1 — Stories. Alice's pure generative step.
  # ─────────────────────────────────────────────────────────────────
  - id: scoping
    label: M1
    name: The Caucus Race
    goal: produce user stories from inhabited personas
    roster: [alice, caterpillar]
    meeting_budget: 0.40
    # T-ab6 — milestone-kind roster filter. Capability milestones
    # run Alice solo (persona-driven user stories from M1); foundation
    # milestones run Caterpillar solo (developer-as-user stories for
    # plumbing/contracts/seed-data). The substrate reads the active
    # milestone's kind from the run scope and narrows the roster
    # accordingly. Eliminates the scope-bleed failure mode where
    # Alice invents user personas for non-user-facing foundation
    # work and pulls capability-milestone scope into the foundation
    # milestone (observed across mvp-demo / obol-demo3 pilots).
    # Without an active milestone scope, falls through to the full
    # [alice, caterpillar] roster (no narrowing).
    milestone_roster_filter:
      field: kind  # informational — substrate reads active scope kind directly
      map:
        capability: [alice]
        foundation: [caterpillar]
    # Entry meeting — the user's launching directive replaces
    # any convenor_directive at runtime. Framing for M1 lives
    # in the agents' constitutions:
    #   - Alice §V carries story shape (personas, situations,
    #     needs, acceptance, confusion-flags).
    #   - Caterpillar's existing engagement rules fire him on
    #     STORY artifacts — same review move he plays in
    #     M2/M5/M8, scoped here to story-shape grounding (does
    #     this story have a confusion-flag, is the persona
    #     specific, are acceptance criteria observable, does
    #     it overlap a sibling, is the scope right for v1).
    # Roster of [alice, caterpillar] gets two-voice review at
    # the source instead of letting weak stories propagate
    # silently into M2 composition. Bus traffic from two
    # agents also helps the meeting actually quiesce when
    # done — the prior alice-alone shape sometimes hung in
    # silence.
    # project_context tells Alice the runtime shape so personas
    # are realistically situated ("opens a terminal" vs "opens a
    # browser tab") instead of generic.
    #
    # Existing stories from prior runs are seeded so Alice and
    # Caterpillar can recognize coverage of the operator's directive
    # rather than regenerating duplicates or churning on concerns
    # until the wall-clock quiescence safety net fires. With prior
    # stories visible, the natural exit is turn-based quiescence:
    # if the directive is already covered, both agents go silent on
    # the first rotation and the meeting closes immediately.
    #
    # consumed_by: feature scopes to stories *without* a feature
    # sourcing them — same logic as M2's binding. A story that
    # already has a feature is past M1's job; surfacing it here
    # would re-prompt Alice/Caterpillar on settled material.
    #
    # ``requirement`` seeds are the discovery output (personas,
    # constraints, success criteria, stack decisions). When
    # ``--milestone <slug>`` is passed, the runner narrows the
    # requirement pool to that milestone's ``consumes_requirements``
    # list, so M1 generates stories grounded in *this* milestone's
    # slice of the corpus rather than the full discovery payload.
    # When no milestone is set, all requirements are visible — same
    # as if scoping never existed.
    seeds:
      - from: any
        kinds: [project_context]
      - from: any
        kinds: [requirement]
      # T-ab11 — seed the active milestone artifact so its goal,
      # done-when, and consumes_requirements reach the agents as
      # structured context, not just as framing text. With T-ab9's
      # milestone-scope filter, only the active milestone surfaces
      # (no sibling pollution). Without this seed, the prepended
      # framing prose is the only narrowing signal — and a wide
      # project_level prime_directive can drown it out.
      - from: any
        kinds: [milestone]
      - from: any
        kinds: [story]
        consumed_by: feature

    # Phased so operators can size the generation pass (more
    # rotations = more breadth; default 3 is the previous engagement-
    # policy behavior). No exit_condition_artifact: M1 is generative
    # — we want it to run rotations until quiescence (everyone has
    # nothing more to add) or the cap is hit, not stop the moment
    # Alice ships her first story.
    phases:
      - name: stories
        max_rotations: 3
        # P16 belt-and-suspenders backup: substrate extends rotation
        # budget until at least 3 stories ship. Validation2 pilots
        # showed M1 can deadlock even with the explicit lead-assignment
        # framing block; this guarantees rotation budget extends rather
        # than exiting empty. Caps via coverage_max_extra_rotations
        # (default 2) so a truly stuck meeting still terminates.
        coverage_check: minimum_stories

  # ─────────────────────────────────────────────────────────────────
  # M2 — Features composed from stories. Rabbit's job, with Alice
  # grounding and Caterpillar checking the composition pass.
  # ─────────────────────────────────────────────────────────────────
  - id: composition
    label: M2
    name: Advice from a Caterpillar
    goal: compose user-facing features from the M1 stories
    roster: [alice, white_rabbit, caterpillar]
    # Rabbit is the primary feature author. Like milestone_plan, he
    # re-emits his FULL feature list each rotation (refining slugs as he
    # goes); _apply_feature_snapshot folds to his most-recent emission so
    # earlier rotations' near-duplicate features don't accumulate (wwu
    # 2026-06-19: 5+6 emissions → 11 features for ~6 surfaces, and
    # decomposition left the stale half as "features with no tickets").
    primary_speaker: white_rabbit
    # 0.40 → 0.60 (wwu 2026-06-19): the discussion phase's concern/
    # nudge ping-pong burned the whole 0.40 before commit could ship a
    # single feature — composition hit MEETING_BUDGET with 0 features on
    # repeated runs, even on a lean milestone. Headroom so commit always
    # gets turns; paired with the discussion-rotation cap below.
    meeting_budget: 0.60
    convenor_directive: |
      **SCOPE LOCK — read this first.** This composition meeting
      designs features for the ACTIVE MILESTONE ONLY (the one named
      in the milestone artifact in your context). Sibling milestones
      exist on disk; they are NOT your concern this run. Common
      drift patterns to avoid (observed on obol-260522-1 M5):

        - "Before I compose M5 features I need clarity on M3→M4
          sequencing" — NO. Compose M5 from M5's stories. Cross-
          milestone sequencing was resolved by the milestone planner;
          re-litigating it here is scope creep.
        - "Story 012 (M4) implies a schema dependency on M3..." —
          surface this as ONE single-sentence concern and move on.
          M4 has already shipped (or will ship in its own run); your
          composition shouldn't amend its features or pre-empt its
          stories.
        - Reading the names of M3/M4 features in tool-use output and
          composing features that bridge them — your features list
          M5 sources only. Cross-milestone bridge features are a
          design smell; the substrate's per-feature iteration filters
          (T-ab17/19/20) handle cross-feature concerns downstream.

      Surface cross-milestone concerns as `concern` (one sentence,
      then move on) — do NOT spend rotations debating them. The
      milestone planner already sequenced the work; your job is to
      design THIS milestone's features well, not to re-plan the
      project.

      **T-ab70 — scope clarification belongs BEFORE the first feature
      decision.** If you have ANY uncertainty about milestone scope
      after reading your context (e.g., "is this v1 or fast-follow,"
      "should this include work that touches sibling milestones,"
      "is the done-when language asking for end-user flow or
      developer-as-user flow"), ship a `question_to_operator` AS
      YOUR VERY FIRST ROTATION OUTPUT. Do NOT compose features first
      and then ask scope-correction questions during M3 decomposition
      or M3.5 consolidation — by that point the substrate has
      already routed downstream work through whatever shape the
      features took. Late scope-correction can't undo a wrong
      composition; it can only tighten the tickets around it.
      Observed in LDR-rerun v10 (2026-06-05): Rabbit composed
      features with end-user-flow shape under a foundation milestone,
      then asked the operator a scope-clarification question during
      consolidation. The operator's "M1 is pure foundation" answer
      arrived in seconds, but the wrong-shape features were already
      settled. Ask EARLY; compose AFTER the operator has confirmed
      scope.

      **Rabbit, ship features.** Read the stories in your context and
      compose them into features — units a stakeholder can describe
      in one sentence. Features come in two kinds; pick the right
      one per feature:

        - ``kind: capability`` (default) — a user-facing capability
          from Alice's persona-driven stories. Maps to "user can
          do X" framing.
        - ``kind: foundation`` — developer-experience plumbing from
          Caterpillar's developer-as-user stories: mock data,
          observability, environment config, build tooling, dev
          dashboards. Maps to "the project gains the ability to X"
          framing — same lifecycle, same tickets, just not a thing
          a non-developer persona would describe. **Don't waste
          budget arguing whether plumbing 'counts as a feature' —
          ship it as ``kind: foundation``.**

      For each feature, name:
        - ``kind`` — capability or foundation (per above)
        - ``stack_span`` (frontend / backend / full-stack)
        - ``milestone`` — **REQUIRED** when the design run was
          launched with ``--milestone <slug>``: copy the active
          milestone's slug (or ``<guid>:<slug>``) verbatim from
          the milestone artifact in your context. Every feature
          you ship in this run belongs to exactly one milestone —
          the active one. A feature whose scope spans into another
          milestone is two features that should be split, not one
          feature with ambiguous attribution. Substrate
          attribution reads this field directly (no inference);
          omitting it falls back to a Jaccard guess that
          repeatedly mis-assigns features in production.
        - ``personas`` — at least one persona name from an M1
          story already in your context; do NOT invent new
          personas or import example names from your training
          (this is a documented bleed pattern — see the
          milestone framing). For foundation features the
          persona is typically a developer from a Caterpillar
          plumbing story; copy the persona's name straight from
          that story.
        - ``tickets`` — leave as an empty list; M3 will populate
        - ``tier`` (v1 / fast-follow / post-launch)
        - ``sources`` — story citations this feature realizes. Each
          entry is either a slug (legacy), a full 26-char GUID, or
          ``"<guid>:<slug>"`` (P18 canonical form — guid is the
          substrate identity, slug is a human-readable continuity
          hint). Slug-only continues to work but is back-compat;
          prefer guid-prefixed when you have the source story's
          guid in context (it appears on the bus + in markdown
          ``**GUID:**`` lines). A guid that doesn't resolve to an
          actual on-disk artifact is a phantom citation; the
          substrate strips the artifact.

      Aim for 3–6 features. Multiple stories can converge on one
      feature when they describe the same capability from different
      personas; one story can split into multiple features when
      the persona's need spans distinct user-visible surfaces.

      **Dedup discipline — features must be distinguishable
      flows, not overlapping slices of the same flow.** A common
      composition failure mode (observed in pilot runs): Rabbit
      ships two features whose titles + descriptions describe the
      *same user journey* with different framing — e.g., "Marcus
      completes registration and equipment setup to start
      onboarding" + "Marcus completes onboarding and is ready to
      view his first routine" both describe the same end-to-end
      onboarding flow. Before shipping a feature, check every
      existing feature in your context:

        - If your candidate feature's ``personas`` overlap with an
          existing feature's personas, AND its ``sources`` overlap
          with that existing feature's sources, you're shipping
          a duplicate — pick one framing and skip the other.
        - If two of your already-shipped features have overlapping
          personas + sources, that's the same bug; ship a third
          feature that *merges* them, then `concern` the operator
          that the substrate doesn't currently have a feature-
          merge primitive so the duplicates stay until pruned
          manually.

      The downstream cost of duplicate features is enormous: M3
      decomposes each into tickets independently, so the same
      implementation work shows up under two features' decomposition
      iterations, and the operator has to figure out which
      attribution is correct. Better to ship one well-named
      feature than two that fight over their tickets.

      **Cross-run note on the story pool you see.** The stories
      seeded into this meeting are only those *without* an existing
      feature sourcing them — the substrate filters out already-
      composed stories so M2 stays focused on uncomposed material.
      You may see existing features (in your project context or via
      cross-run grounding) whose ``Sources:`` reference story slugs
      that aren't in your seed pool. That's not a missing story; it's
      a story the substrate considers already-handled by its
      existing feature. Don't try to re-source those stories — the
      feature already realizes them. Focus your composition on the
      stories that ARE visible.

      **Silence is wrong here — your job is to produce features.**
      Without features, M3 has no input.

      **Alice — grounding voice.** You wrote the stories. Push back
      when a feature has drifted from a story your persona would
      recognize, or when a story you wrote has no feature serving
      it. Default to silence unless a grounding intervention is
      needed.

      **Caterpillar — composition pass.** For each feature Rabbit
      ships, ask: does this claim hold against the stories that
      sourced it? If a feature aggregates incoherent stories or
      makes a claim the stories don't support, surface the gap
      so Rabbit can revise.

      **Keep the diagram stack current (P21).** The milestone-plan
      laid down an initial set of Ophanic layout diagrams — the
      build-tracking map (the `.oph` files in your context). As you
      compose features, the concrete component shape sharpens: a
      feature may introduce a surface or component the initial stack
      didn't draw, or split one drawn box into its real parts. When
      that happens, ship a `diagram` decision to publish a new
      diagram or update an existing one (same slug → updates in
      place). Rules that make this worth doing:

        - **Keep component names stable.** A node's identity (and the
          ticket links that will hang off it downstream) is keyed on
          its component name. Renaming ``Dashboard`` → ``DashboardView``
          across a redraw orphans its links. Add and refine; don't
          churn names.
        - **One box per component, each in its own box** — the same
          convention the milestone-plan diagrams follow, so node
          extraction stays clean.
        - **Only touch diagrams a feature actually changes.** Silence
          on diagrams is correct when the existing stack already
          covers the features you're composing. This is a refinement
          pass, not a redraw.

    seeds:
      - from: any
        kinds: [project_context]
      # T-ab11 — active milestone artifact (T-ab9 scope-filtered).
      # Carries goal + done-when + consumes_requirements as
      # structured context so Rabbit composes features bounded
      # by *this* milestone's scope rather than the project-level
      # directive's full surface.
      - from: any
        kinds: [milestone]
      # T-ab72 — requirement bodies, T-ab9 scope-filtered to the
      # active milestone's consumes_requirements. M2 composition
      # without this saw the milestone artifact name a requirement
      # slug (e.g. "kohl-can-sign-up-...") but never the body —
      # ldr-final-final M1 (2026-06-06) shipped operator questions
      # asking what the requirement said + a Cat question re-asking
      # for the session mechanism that was already specified in
      # discovery's I3 answers. Cost: 2 operator-cycles per run for
      # information already on disk + a measurable redundancy floor.
      # With T-ab9's narrowing, M2 pulls only this milestone's
      # consumed requirements (typically 1-3), not the full corpus.
      - from: any
        kinds: [requirement]
      # consumed_by: feature scopes M2 to *uncomposed* stories. On
      # cross-run design passes (operator iterating tdd-design 5–10×
      # against the same project, the workflow's economic argument),
      # stories from prior passes that already have features
      # sourcing them are dropped. Without this, Rabbit re-
      # composes the entire history into duplicate features —
      # observed in the May 10 obol mock-data design pass: M2
      # was renegotiating the prior run's stories instead of
      # focusing on the new mock-data ones.
      - from: scoping
        kinds: [story]
        consumed_by: feature
      # P21 — the current diagram stack (milestone-plan's build-tracking
      # map). Seeded so composition refines/extends it in place rather
      # than re-drawing from scratch; node names stay stable, so the
      # ticket links auto-attached downstream survive.
      - from: any
        kinds: [diagram]

    transition_emitted_to: proposed
    phases:
      # Discussion phase has the same exit condition as commit — if
      # Rabbit has enough context to ship after one rotation of
      # alignment, he ships and discussion ends early. Without this,
      # discussion exhausts all 3 rotations before commit can fire,
      # and the meeting_budget runs out in concern/nudge ping-pong
      # before commit ever ships a feature artifact (observed in
      # the obol mock-data design pass: 19 calls of concerns + 0
      # features).
      # max_rotations 3 → 2 (wwu 2026-06-19): discussion was running
      # all 3 rotations of 3-agent ping-pong and starving commit. The
      # exit_condition_artifact: feature was supposed to end discussion
      # early, but Rabbit ships features in COMMIT not discussion, so it
      # never fired. Cap discussion so the budget reaches commit, where
      # features actually get composed.
      - name: discussion
        max_rotations: 2
        exit_condition_artifact: feature
      - name: commit
        max_rotations: 2
        exit_condition_artifact: feature
        # P15 T-m8b — at end of each rotation, verify every
        # requirement the active milestone consumes has at least
        # one feature realizing it (via the story-level
        # ``realizes_requirements`` linkage from T-m8b).
        # Triggers a synthetic Dodo observation listing unrealized
        # requirements + grants a bonus rotation so Rabbit can
        # compose additional features. No-op when ``--milestone``
        # isn't passed (no scope to anchor against). Gates ONLY
        # the commit phase, not discussion — discussion's job is
        # to surface concerns; commit's job is to ship features
        # that close the milestone.
        coverage_check: milestone_realization

  # ─────────────────────────────────────────────────────────────────
  # M3 — Tickets per feature. Rabbit decomposes one feature at a
  # time into v1 tickets. Per-feature iteration so each feature gets
  # focused decomposition.
  # ─────────────────────────────────────────────────────────────────
  - id: decomposition
    label: M3
    name: The Rabbit's Errand
    goal: decompose each feature into v1 tickets the Tweedles can pick up
    roster: [alice, white_rabbit]
    per_item: feature
    # Only decompose features that haven't been decomposed yet.
    # M2 emits feature → state proposed; M3 transitions →
    # in_design (after this iteration). On cross-run design
    # passes, features from prior runs are at designed (or
    # later); filter [proposed] correctly skips them. Without
    # this, M3 iterates over already-decomposed features and
    # ships duplicate tickets.
    iterate_only_in_states: [proposed]
    parallel: true  # T93: feature-level decomposition is structurally
                    # independent — feature A's tickets and feature B's
                    # never reference each other's payloads.
    meeting_budget: 0.30
    # Drop Alice from foundation-feature iterations. Validation3
    # pilots showed Alice consistently intervening on foundation
    # features (kind=foundation, developer/operator/installer
    # personas) at M3 with persona-grounding concerns, even
    # though the feature's persona was already settled at M2 and
    # the framing-prepend exempts foundation personas from the
    # seeded-whitelist. Her pattern-match instinct at M3 is to
    # question whether Operator/Developer/Installer count as
    # "real" personas — answer: yes, for foundation work — but
    # the question alone makes Rabbit hesitate and the iteration
    # ships zero tickets. Substrate-enforced: foundation features
    # decompose with Rabbit alone; Alice still buzzes in via
    # §III if she sees something concrete worth raising.
    per_item_roster_filter:
      field: kind
      map:
        capability: [alice, white_rabbit]
        foundation: [white_rabbit]
    convenor_directive: |
      **Rabbit, decompose this feature into tickets.** The feature
      in your context is a user-facing capability; your job is to
      name the implementation atoms that ship together to deliver it.

      For each ticket, name:
        - ``title`` — what the ticket is, in one short phrase
        - ``owner`` — which Tweedle (tweedledee for frontend bias,
          tweedledum for backend bias, or "either" for full-stack)
        - ``tier`` (v1 / fast-follow / post-launch — usually
          inherits from feature tier)
        - ``stack_span`` — **REQUIRED**: one of ``frontend``,
          ``backend``, or ``full-stack``. The substrate uses this
          to scope M7 (implementation) to just the Tweedle whose
          side the ticket touches — frontend tickets only load
          Tweedledee, backend tickets only load Tweedledum,
          full-stack tickets load both. Don't default everything
          to ``full-stack`` to be safe; that defeats the whole
          point of the field. **Be explicit and stingy**:
            - ``frontend`` when the ticket's deliverable is a UI
              component, route, page, store action, frontend
              schema, client-side validation, etc. — code that
              lives under the frontend tree only.
            - ``backend`` when the deliverable is a model, API
              endpoint, migration, scheduled job, server-side
              validation, integration, etc. — code under the
              backend tree only.
            - ``full-stack`` ONLY when the ticket genuinely
              requires both sides to ship together as one unit
              (e.g. a new feature that needs a backend endpoint
              AND the frontend that calls it, where shipping
              one without the other leaves a broken half).
          If a frontend ticket needs a backend change to land
          first, that's a ``Blocked by:`` dependency on a
          SEPARATE backend ticket, not a reason to mark this one
          ``full-stack``. Splitting reduces M7 cost and clock time
          materially; merging defeats the optimization.
        - ``estimate`` (your honest read; the Tweedles will adjust)
        - ``description`` — what shipping this ticket means
        - ``sources`` — **REQUIRED**: the parent feature's citation
          must be the FIRST entry in this list. The substrate uses
          this link to know which tickets belong to which feature
          when tdd-implement iterates per-ticket. Cite the parent
          feature by slug (legacy), full GUID, or ``"<guid>:<slug>"``
          (P18 canonical, preferred — you'll see the parent's
          ``**GUID:**`` line in the convener directive's existing-
          features block). You may add additional source citations
          (other features the ticket touches, stories the ticket
          realizes), but the parent feature comes first. Without
          this, the substrate can't tell which tickets to implement
          when the operator queues a feature.
        - ``acceptance`` — observable conditions of done

      Aim for 1–4 tickets per feature. A feature with 0 tickets is
      a feature that's not actually decomposed; a feature with 6+
      tickets is probably actually 2 features that should be split
      back in M2. (M2 is closed by now; if you find this, ship the
      tickets you have but flag the feature for re-composition in
      a future design run.)

      **Alice — same grounding role.** Defend the user-facing point
      of the tickets. Push back when a ticket compresses a story
      past user-recognition or drifts toward technical convenience.

    seeds:
      - from: any
        kinds: [project_context]
      # T-ab11 — active milestone artifact for decomposition scope
      # discipline. Rabbit's ticket decomposition stays bounded by
      # the milestone's done-when, not the project-level directive.
      - from: any
        kinds: [milestone]
      # T-ab72 — requirement bodies (T-ab9 scope-filtered to active
      # milestone's consumes_requirements). Decomposition without
      # them: ldr-final-final M3 lanes shipped tickets for M2's
      # partner-profile + M6's dashboard frontend because Rabbit
      # had only feature titles to reason from and reached for
      # plausible adjacent slugs that don't exist on disk (phantom
      # "kohl-can-set-their-partner-location" citation). With the
      # requirement bodies visible, decomposition can ground in
      # what the active milestone's done-when actually says.
      - from: any
        kinds: [requirement]
      - from: scoping
        kinds: [story]
      - from: composition
        kinds: [feature]

    transition_iteration_to: in_design
    # Single-phase with exit_condition: ticket. As soon as Rabbit
    # ships the first ticket, the meeting can exit; Alice's
    # grounding pushback shows up as concerns during the rotations,
    # not as a separate phase. Squathero already came in well under
    # budget at this meeting (\$0.02-\$0.08 per feature) so the
    # rotation budget tightening is precautionary, not a cost-cut.
    phases:
      - name: decompose
        max_rotations: 2
        exit_condition_artifact: ticket

  # ─────────────────────────────────────────────────────────────────
  # M3.5 — Consolidation per feature. Rabbit + Caterpillar review the
  # decomposed tickets, prune duplicates, and assign explicit blocked-
  # by dependencies. Right time to do this is immediately after M3
  # while the tickets are fresh in mind, and before M4's architecture
  # work which would otherwise be done against an over-decomposed
  # ticket set.
  #
  # Cuts downstream cost: a feature decomposed into 13 overlapping
  # tickets in M3 (squathero's migration feature, obol's cash-flow
  # monolith) becomes 5-7 right-sized tickets here. M6/M7/M8 then
  # iterate over the smaller set, which dominates implementation
  # spend. Pays for itself ~3-5×.
  #
  # Mechanism: agents have ``delete_file`` tool access to drop
  # duplicate ticket files directly, and re-emit ``ticket`` artifacts
  # with updated ``Blocked by:`` lines for surviving tickets. No new
  # artifact kind — the consolidation IS the resulting on-disk
  # ticket set.
  # ─────────────────────────────────────────────────────────────────
  - id: consolidation
    label: M3.5
    name: A Caterpillar's Edit
    goal: |
      consolidate this feature's tickets — merge overlaps, prune
      duplicates, and assign explicit blocked-by dependencies so
      M7 can serialize implementations of dependent tickets
    roster: [white_rabbit, caterpillar]
    per_item: feature
    iterate_only_in_states: [in_design]
    parallel: true
    meeting_budget: 0.30
    convenor_directive: |
      **Rabbit — ship ``ticket`` decisions only. Do NOT emit a
      ``feature`` decision in this meeting.** This is the trap: the
      iteration item IS a feature, but the meeting's job is
      consolidating its TICKETS. M2 is closed; you don't ship
      features here. Every emission you make in this meeting is a
      ``ticket`` decision (or ``concern`` / ``silence`` / ``question_to_operator``
      when something else applies).

      M3 just decomposed this feature into tickets and two failure
      modes are common at M3: over-decomposition (one capability
      sliced into 8 micro-tickets that should be 3) and missing
      dependencies (no explicit ``Blocked by:`` so M7 implementations
      race on shared foundations). M3.5 fixes both per feature.

      **What ``ticket`` emissions to make:**

        - **Tickets you want to keep AS-IS** with no changes: don't
          re-emit them. Just leave them alone.
        - **Tickets you want to MERGE**: ship a new ``ticket``
          decision with the merged content (combined acceptance,
          broader description, union of sources from the absorbed
          tickets). Caterpillar will delete the absorbed ones.
        - **Tickets whose ``Blocked by:`` needs updating** (this is
          the dependency-assignment goal of the meeting): ship a
          new ``ticket`` decision with the existing slug, the
          existing content, and a fresh ``dependencies.blocked_by``
          list naming the upstream ticket slugs.

      **Assigning ``Blocked by:`` is the load-bearing job.** Walk
      this feature's tickets. For each one ask: which other
      tickets' implementations does this need on disk before it
      can start? A ticket that calls ``apply_migrations()`` is
      blocked_by the ticket that defines it. M7 reads these to
      serialize dependent implementations — without them, dependent
      tickets race against half-built foundations and produce
      duplicate divergent code. Be explicit.

      **Caterpillar — prune duplicates with ``delete_file``.** You
      have the file-deletion tool; Rabbit doesn't. After Rabbit
      re-emits a merged ticket, the OLD ticket files (the absorbed
      slugs) are still on disk. Use ``delete_file`` on
      ``.wonderland/tickets/<old-ticket-file>.md`` to remove them.
      Same for tickets that should drop entirely without
      replacement (genuine duplicates Rabbit didn't re-emit).

      **PREFER `retract` OVER `delete_file` FOR TICKETS.** The
      substrate has a first-class `retract` decision that names
      specific target_slugs, removes them from bus + disk, and logs
      the action in the transcript. Use that. `delete_file` is the
      raw escape hatch — reserve it for orphaned files (e.g. a
      ticket whose markdown exists but never made it to the bus
      registry). The validation4 pilot deleted EVERY ticket via
      aggressive `delete_file` calls including the freshly-merged
      consolidations. The retract path is safer because it's
      scoped to slugs you can name in writing — if you can't say
      "I am removing ticket-NNN because it duplicates ticket-MMM,"
      you shouldn't be deleting it.

      **Hard rule: never delete more tickets than you have explicit
      evidence to retract.** A duplicate is two tickets covering the
      same acceptance criteria with the same stack-span. "Adjacent
      scope" or "could be combined" is NOT duplication; raise that
      as a `concern` so the next design pass addresses it cleanly.
      Better to leave 6 tickets standing for a feature than to
      delete a real one alongside a duplicate.

      Verify before retracting / deleting: a ticket whose slug
      appears as a ``Sources:`` entry on a still-surviving sibling
      is fair game. A ticket whose acceptance criteria a sibling
      doesn't actually absorb is NOT — push back as a concern
      instead of pruning.

      **If the meeting ends with the consolidated ticket count at
      zero, you've over-pruned.** Better outcome: ship the review
      describing the redundancy + retract only the specific dupes
      you can name. Leave the originals when in doubt.

      **THE SURFACE TEST — apply this FIRST, before anything else.**
      Two tickets are duplicates if they build the SAME surface — the
      same endpoint (both ``POST /auth/signup``) or the same UI element
      (both the sign-up form) — no matter how differently they are
      worded. This is the most-missed case, because reworded dups don't
      *look* alike. Concretely, walk your tickets and write down the one
      endpoint or UI surface each delivers:
        - ``Implement POST /auth/signup with email + password validation``
          and ``POST /auth/signup — email + password account creation``
          → BOTH deliver ``POST /auth/signup``. Same surface, reworded.
          DUPLICATE — keep the more complete one, retract the other.
        - ``Implement frontend sign-up form`` and ``Frontend: Sign-up
          flow`` → BOTH deliver the sign-up form UI. DUPLICATE.
      Any surface that appears on two tickets under this feature is a
      duplicate. The M1 design pass shipped 13 tickets for one feature
      where signup, signin, and both frontend forms each appeared TWICE —
      every pair was a same-surface reword, and none got merged. Don't
      let that happen.

      **Guard — different surfaces are NOT duplicates even when the
      titles are nearly identical.** ``POST /auth/signup`` and ``POST
      /auth/signin`` are different endpoints; ``Sign-up flow`` and
      ``Sign-in flow`` are different UI surfaces. A frontend form and its
      backend endpoint are different deliverables. Never merge across a
      surface boundary — only collapse tickets that build the *same* one.

      **Near-duplicate patterns to MERGE** (T-ab63). The LDR-rerun
      pilot shipped these pairs in M1's foundation feature; they
      are textually different but functionally identical and should
      be collapsed. Use them as templates for what to look for:

        - ``Backend: User model + signup endpoint with bcrypt password hashing``
          vs ``Backend: User model + SQLite schema + password hashing``
          → same component (User model + hashing), different verb
          framings (endpoint exposure vs schema initialization).
          MERGE — these describe the same disk footprint.

        - ``Backend: signin endpoint + /api/me + session middleware``
          vs ``Backend: Session middleware + signed cookies + /api/me + /api/signout``
          → same component (session middleware + auth-aware routes),
          one ticket per phrasing. MERGE.

        - ``Frontend: /signup and /signin routes + forms wired to backend``
          vs ``Frontend: /signup and /signin routes + forms + integration``
          → same component (signup/signin routes + forms), "wired
          to backend" and "integration" are synonyms. MERGE.

        - ``Backend: POST /api/signup endpoint + validation`` and
          ``Backend: POST /api/signin endpoint + password verification``
          as separate tickets when a sibling already covers
          ``User model + signup endpoint``: the per-endpoint slices
          duplicate the grouped one's acceptance. MERGE the
          per-endpoint ones into the grouped sibling.

      **Decision rule**: if two tickets cover the same primary
      component on disk (the same file or pair of files) with
      different verb framings — definition vs initialization, endpoint
      vs middleware, wired vs integrated, grouped-multi vs per-item-
      slice — they ARE near-duplicates. Merge them. The hard rule
      against over-pruning still holds: name the specific pair and
      the shared component in writing. Hesitation here ships
      duplicate implementation work to M7 (two tweedles building
      overlapping code).

      **Aim for 3-7 tickets per feature after consolidation.** A
      feature with 8+ tickets after M3.5 is probably actually two
      features that should split back at M2 (flag as a concern; M2
      is closed but the operator can re-run design) — OR has the
      near-duplicate pattern above and needs merging.

      **Silence is okay if there's nothing to consolidate** — a
      feature with 3 well-scoped tickets and no merge-or-deps work
      to do is fine to leave untouched. Don't manufacture
      consolidation just because the meeting opened. But "I see
      a near-duplicate pair but am not sure if it counts" is NOT
      silence territory — ship it as a `concern` naming the pair
      so the operator can flag.

    seeds:
      - from: any
        kinds: [project_context]
      # T-ab11 — active milestone artifact for consolidation scope
      # discipline. Consolidation merges/dedups tickets within a
      # feature; the milestone artifact frames what "in scope"
      # means for this feature's tickets.
      - from: any
        kinds: [milestone]
      # T-ab72 — requirement bodies (T-ab9 scope-filtered).
      # Consolidation reasons about which tickets are in scope vs
      # out of scope — that judgment needs the requirement body,
      # not just the slug listed in the milestone.
      - from: any
        kinds: [requirement]
      # Feature binding stays on its own so the iteration-kind slice
      # keeps only THIS lane's feature artifact (current_item_slug
      # match against feature.payload.slug).
      - from: any
        kinds: [feature]
      # Tickets from the decomposition meeting, lane-scoped via the
      # per_item paired-suffix rule (decomposition-<feature_slug>).
      # Critical to split this from the feature binding above:
      # combining them as ``kinds: [feature, ticket]`` triggers the
      # iteration-kind slice (because ``feature`` is the iteration
      # kind), which drops every utterance that lacks a matching
      # feature artifact — including M3's ticket-only emissions.
      # Squathero2's first M3.5 run hit this: 5 of 6 lanes opened
      # with zero tickets in their context, so Rabbit had nothing
      # to consolidate and reverted to M2 muscle memory (re-emitting
      # the parent feature instead of shipping ``ticket`` decisions).
      - from: decomposition
        kinds: [ticket]

    # Single-phase with the same exit-on-artifact + tighter rotations
    # pattern as the rest of the workflow. Exit on ticket emission —
    # if Rabbit's first emission is the consolidated set, no need
    # to keep rotating. (Multi-emission cases — Rabbit drops a few
    # tickets THEN re-emits with deps — fall through to max
    # rotations cleanly.)
    phases:
      - name: consolidate
        max_rotations: 2
        exit_condition_artifact: ticket

  # ─────────────────────────────────────────────────────────────────
  # M4 — Architecture + security. Cat ADR + Queen ruling, both
  # grounded in concrete features + tickets. Single project-wide
  # meeting; doesn't transition individual features (architecture
  # commitment isn't per-feature).
  # ─────────────────────────────────────────────────────────────────
  - id: architecture
    label: M4
    name: A Mock Turtle's Lament
    goal: |
      produce architectural commitments (ADRs) and security rulings,
      grounded in the features + tickets the team has shipped
    roster: [alice, cheshire_cat, queen_of_hearts]
    meeting_budget: 0.40
    # T-ab19: skip M4 entirely when the active milestone scope has
    # zero in-scope features with tickets. An ADR grounded in zero
    # concrete deliverables ends up generic/abstract; cheap to skip
    # rather than burn budget. Fires for the case where M2 cross-
    # emits everything to other milestones (T-ab17 filters them
    # out) leaving M3 with no tickets to architect against.
    requires_active_scope_tickets: true
    convenor_directive: |
      The features + tickets are settled. Now the team commits to
      the architectural shape that delivers them.

      **First, re-read the operator's directive in your context.**
      The directive seed is the operator's literal launching prompt
      — read it before drafting the ADR. Stack constraints named
      there (e.g. "TUI", "CLI", "mobile app", "web app") are
      non-negotiable architectural commitments. If the directive
      says "TUI" and you're considering a frontend/backend split,
      stop — the directive constrains the runtime shape, and the
      ADR must serve it. Stories paraphrase; the directive is
      verbatim.

      **Cat — write ADR(s).** Each ADR names a structural decision
      (storage shape, integration patterns, data flow) with explicit
      tradeoffs (what the alternative would have been + why we're
      not choosing it). Ground every claim in the directive +
      features + tickets; don't architect for hypothetical
      extensions. Use status "Proposed" so M5 can challenge if
      contracts can't realize the ADR.

      **Queen — security ruling pass.** For each feature, name the
      threat model: what's the attack surface, what could go wrong,
      what's the team committing NOT to do (deferred to fast-follow
      vs. accepted as inherent risk). One ruling per feature where
      the threat model is non-trivial; skip features with no
      meaningful security posture.

      **Alice — grounding voice.** Push back when an architectural
      decision drifts from the user-facing point of the features
      it supports OR drifts from the operator's directive. The
      architecture serves the personas + the directive's runtime
      shape, not the other way around.

    seeds:
      # Project context memory — authoritative project-level facts
      # (stack, entry point). When the skeleton populated it on
      # apply, Cat reads "runtime: tui" as a hard constraint and
      # can't drift into frontend/backend split language. Falls
      # through gracefully when the project predates context
      # memory (greenfield via legacy paths).
      - from: any
        kinds: [project_context]
      # T-ab11 — active milestone artifact for ADR scope discipline.
      # Cat architects to serve the active milestone's done-when,
      # not the project-level directive's full surface.
      - from: any
        kinds: [milestone]
      # T-ab72 — requirement bodies (T-ab9 scope-filtered).
      # ADR's tradeoff weighing relies on what the requirements
      # specify (e.g. "signed cookies" vs "JWT" is already pinned
      # by I3's scope-interview answer — Cat shouldn't be asking).
      - from: any
        kinds: [requirement]
      # Operator's literal launching prompt. Even when project
      # context names the stack, the directive carries intent for
      # *this* run — what feature, what scope. Cat reads both:
      # context for stack ground truth, directive for run intent.
      - from: any
        kinds: [directive]
      - from: scoping
        kinds: [story]
      - from: composition
        kinds: [feature]
      - from: decomposition
        kinds: [ticket]
    # exit_condition mirrored to discussion + tightened rotations.
    # Squathero produced 11 ADRs at this meeting for \$1.48 (≈3.7×
    # the \$0.40 budget) — Cat kept shipping ADRs because nothing
    # exits the meeting. With exit on first ADR, Cat ships one
    # well-grounded architectural commitment; further architectural
    # decisions come from operator-driven re-runs of M4 rather than
    # one mega-meeting that produces 11 overlapping ADRs.
    phases:
      - name: discussion
        max_rotations: 2
        team_groupings: [[cheshire_cat, queen_of_hearts, alice]]
        exit_condition_artifact: adr
      - name: commit
        max_rotations: 1
        team_groupings: [[cheshire_cat, queen_of_hearts, alice]]
        exit_condition_artifact: adr

  # ─────────────────────────────────────────────────────────────────
  # M5 — Contracts per feature. Tweedles negotiate seams informed
  # by the ADR. Per-feature iteration.
  # ─────────────────────────────────────────────────────────────────
  - id: contract-negotiation
    label: M5
    name: The Pair Protocol
    goal: negotiate per-feature contracts informed by the ADR
    roster: [tweedledee, tweedledum, alice]
    per_item: feature
    # Only contract features that have been decomposed but not
    # yet contracted. M3 transitions feature → in_design; M5
    # transitions → designed. On cross-run design passes,
    # features from prior runs are at designed (or later);
    # filter [in_design] correctly skips them. Without this,
    # M5 re-negotiates contracts that already exist and ships
    # duplicate contract notes.
    iterate_only_in_states: [in_design]
    # T-ab16: skip features whose M3 decomposition + M3.5
    # consolidation produced zero constituent tickets. A
    # feature with no tickets has nothing for the Tweedles
    # to contract about. Observed in mvp-demo-rerun-A M3
    # design: 7 features shipped, 6 collapsed to 0-ticket
    # dead weight after consolidation, M5 iterated all 7
    # at $0.30-0.60/iter — ~$2-3 of pure waste.
    iterate_only_with_tickets: true
    parallel: true  # T93: contracts negotiate per-feature seams
                    # independently. Feature A's API shape and
                    # feature B's UI envelope are separate concerns.
    # Bumped from 0.40 → 0.60 after the discovery2 pilot — M5
    # was hitting MEETING_BUDGET on routine contracts (89s elapsed,
    # ~$0.40 burned, no COMPLETE), which leaves the feature stuck
    # at in_design instead of transitioning to designed. The two-
    # Tweedle back-and-forth on schema is genuinely more expensive
    # than a single-voice generation step; 0.60 covers the
    # observed median + a little headroom without giving M5
    # license to spiral.
    meeting_budget: 0.60
    convenor_directive: |
      **Tweedles — negotiate the contract for this feature.**

      **First, read project_context (in your seed context) for the
      runtime shape.** Your role names ("tweedledee = frontend
      bias", "tweedledum = backend bias") describe a division of
      labor that interprets DIFFERENTLY in different runtimes.
      Translate before negotiating:

        - ``runtime: tui`` (single-process terminal app):
          tweedledee = widget / screen / layout layer; tweedledum
          = data / model / persistence layer. The boundary between
          you is module imports, not HTTP. Contracts that name
          REST endpoints, fetch shapes, response envelopes, or
          cache-TTL semantics across this boundary are wrong —
          you're inside the same process. Use function signatures,
          dataclass shapes, and module-level invariants.

        - ``runtime: cli`` (single-shot command-line):
          tweedledee = argparse / output formatting; tweedledum =
          subcommand logic + persistence. Same in-process rule:
          no HTTP between you.

        - ``runtime: web`` (client-server, browser + service):
          legacy interpretation applies. tweedledee owns the
          browser surface, tweedledum owns the API service, the
          boundary IS HTTP, contracts name endpoints + verbs +
          response envelopes.

        - ``runtime: service`` (long-running daemon, no UI):
          tweedledum carries; tweedledee may not be relevant.

      If the directive named a runtime the project_context block
      doesn't list, default to single-process unless the directive
      explicitly says client-server.

      Read the feature, its constituent tickets, and the ADRs in
      your context. Produce contract notes that name the seams in
      the right shape for the runtime: function signatures + data
      classes for in-process; endpoints + envelopes for HTTP.
      Contracts are the bridge from architectural intent (ADR) to
      per-ticket implementation work (next phase).

      Stack span (the feature's own ``stack_span`` field) guides
      who leads, AS INTERPRETED through the runtime above:
        - ``full-stack`` features: both negotiate the seam together
        - ``frontend`` features: tweedledee leads, tweedledum confirms
        - ``backend`` features: tweedledum leads, tweedledee confirms

      A contract note carries: ``proposed_change`` (required, non-
      empty — what shape are we committing to?), ``current_shape``
      (the existing contract or "n/a, fresh feature"), and
      ``rationale`` (why this shape and not the obvious alternative).

      **Alice — grounding voice.** Push back when a contract
      compresses the user-facing point of a feature past
      recognition, OR when a contract drifts from the runtime
      shape (HTTP language in a TUI project, etc.). Default to
      silence; engage when a seam decision threatens a story your
      persona would recognize OR threatens the runtime fact in
      project_context.

    seeds:
      # Project context memory — runtime shape is the FIRST thing
      # the Tweedles read so their division of labor adapts to
      # the project's actual architecture (analysis 040 / r42-obol
      # post-fix: ADR was framework-agnostic but contracts still
      # drifted to HTTP because role-shape was fixed in their
      # constitutions and not in M5's frame).
      - from: any
        kinds: [project_context]
      # T-ab11 — active milestone artifact for contract scope
      # discipline. Contracts are negotiated to satisfy this
      # milestone's done-when, not the project-level surface.
      - from: any
        kinds: [milestone]
      # T-ab72 — requirement bodies (T-ab9 scope-filtered). M5
      # contract negotiation needs the requirement's specification
      # to know what the contract has to satisfy beyond the
      # feature title.
      - from: any
        kinds: [requirement]
      - from: any
        kinds: [directive]
      - from: composition
        kinds: [feature]
      - from: decomposition
        kinds: [ticket]
      - from: architecture
        kinds: [adr, ruling]

    transition_iteration_to: designed
    # Same fix as M4/M6/M7/M8: exit_condition mirrored to discussion
    # so the meeting ends as soon as the Tweedles ship a contract
    # note instead of rotating through max_rotations regardless.
    # Squathero ran 7 parallel M5 lanes at \$0.50-\$0.66 each
    # (≈1.5× the \$0.40 budget) — fix should bring most lanes to
    # the budget ceiling.
    phases:
      - name: discussion
        max_rotations: 2
        team_groupings: [[tweedledee, tweedledum, alice]]
        exit_condition_artifact: contract_note
      - name: commit
        max_rotations: 1
        team_groupings: [[tweedledee, tweedledum, alice]]
        exit_condition_artifact: contract_note
category: design
