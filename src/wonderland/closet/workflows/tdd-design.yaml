name: tdd-design
description: |
  Design-phase atom of the TDD pipeline. Produces designed features —
  features with constituent tickets, an architectural commitment, and
  per-feature contracts — but does not implement them. Operator runs
  this phase, reviews the designed features, picks which to queue for
  implementation, then runs tdd-implement (the implement-phase atom)
  separately.

  The split exists for cost-of-iteration reasons: design runs are
  ~$0.50–$2 territory; implementation is $5–$15. Being able to
  iterate design 5–10× before committing implementation budget is a
  structural change in the cost curve. Cross-run continuity (the
  seed-fallback shipped in 0.3.0) means refined ADRs and stories
  from prior design runs carry forward, so iterating design on the
  same project is meaningful work, not redundant regeneration.

  ## Order rationale (analysis 040)

  Stories → features → tickets → architecture → contracts. Two
  changes vs the previous tdd-serial-phased shape:

  1. **Features come BEFORE tickets** (was the other way around).
     Tickets are implementation atoms; features are user-meaningful
     capabilities. Going stories → features → tickets matches how
     product → engineering decomposes work in real teams. The
     previous order (tickets first, features composed from them)
     led to monolithic-feature collapse in r43-obol — Rabbit lumped
     six tickets into one feature because the grouping was post-hoc
     rationalization. Features-first means natural cleavage and
     stable per-feature ticket granularity.

  2. **Architecture + security come AFTER feature/ticket generation**
     (was Cat alongside Alice in M1). Cat architecting from concrete
     features + tickets produces grounded ADRs (see r42-obol's
     ADR-002 — "three backend domains" was grounded in personas).
     Cat architecting from stories alone (r41-obol's ADR-001) is
     more abstract and less actionable. Same logic for the Queen's
     security pass — concrete material to threat-model against.

  Hatter doesn't appear in this workflow. Tea Party (Hatter writing
  failing tests) is part of TDD's red-green loop and lives in
  tdd-implement, not here. Designed features ship without test
  scenarios; the implementation phase generates failing tests +
  passing implementation as a paired loop per ticket.

  ## Output

  - User stories (Alice's M1 work)
  - Features grouped by user-meaningful capability
  - Tickets per feature (implementation atoms with stack_span tier)
  - One or more ADRs (architectural commitments)
  - Zero or more security rulings (Queen's threat-model output)
  - Contract notes per feature (Tweedles' negotiated seams)
  - Features end up in lifecycle state ``designed``

  ## A/B baseline

  When tdd-implement runs against features designed by this workflow,
  the per-iteration payloads should be tighter than tdd-serial-phased
  (no scenario sprawl mid-design; each meeting focused on one job).
  Watch r-obol-design-vs-monolithic for the comparison.

version: 1

defaults:
  budget_dollars: 3.00
  quiescence_seconds: 300.0

meetings:

  # ─────────────────────────────────────────────────────────────────
  # M1 — Stories. Alice's pure generative step.
  # ─────────────────────────────────────────────────────────────────
  - id: scoping
    label: M1
    name: The Caucus Race
    goal: produce user stories from inhabited personas
    roster: [alice, caterpillar]
    meeting_budget: 0.40
    # Entry meeting — the user's launching directive replaces
    # any convenor_directive at runtime. Framing for M1 lives
    # in the agents' constitutions:
    #   - Alice §V carries story shape (personas, situations,
    #     needs, acceptance, confusion-flags).
    #   - Caterpillar's existing engagement rules fire him on
    #     STORY artifacts — same review move he plays in
    #     M2/M5/M8, scoped here to story-shape grounding (does
    #     this story have a confusion-flag, is the persona
    #     specific, are acceptance criteria observable, does
    #     it overlap a sibling, is the scope right for v1).
    # Roster of [alice, caterpillar] gets two-voice review at
    # the source instead of letting weak stories propagate
    # silently into M2 composition. Bus traffic from two
    # agents also helps the meeting actually quiesce when
    # done — the prior alice-alone shape sometimes hung in
    # silence.
    # project_context tells Alice the runtime shape so personas
    # are realistically situated ("opens a terminal" vs "opens a
    # browser tab") instead of generic.
    #
    # Existing stories from prior runs are seeded so Alice and
    # Caterpillar can recognize coverage of the operator's directive
    # rather than regenerating duplicates or churning on concerns
    # until the wall-clock quiescence safety net fires. With prior
    # stories visible, the natural exit is turn-based quiescence:
    # if the directive is already covered, both agents go silent on
    # the first rotation and the meeting closes immediately.
    #
    # consumed_by: feature scopes to stories *without* a feature
    # sourcing them — same logic as M2's binding. A story that
    # already has a feature is past M1's job; surfacing it here
    # would re-prompt Alice/Caterpillar on settled material.
    seeds:
      - from: any
        kinds: [project_context]
      - from: any
        kinds: [story]
        consumed_by: feature

  # ─────────────────────────────────────────────────────────────────
  # M2 — Features composed from stories. Rabbit's job, with Alice
  # grounding and Caterpillar checking the composition pass.
  # ─────────────────────────────────────────────────────────────────
  - id: composition
    label: M2
    name: Advice from a Caterpillar
    goal: compose user-facing features from the M1 stories
    roster: [alice, white_rabbit, caterpillar]
    meeting_budget: 0.40
    convenor_directive: |
      **Rabbit, ship features.** Read the stories in your context and
      compose them into features — units a stakeholder can describe
      in one sentence. Features come in two kinds; pick the right
      one per feature:

        - ``kind: capability`` (default) — a user-facing capability
          from Alice's persona-driven stories. Maps to "user can
          do X" framing.
        - ``kind: foundation`` — developer-experience plumbing from
          Caterpillar's developer-as-user stories: mock data,
          observability, environment config, build tooling, dev
          dashboards. Maps to "the project gains the ability to X"
          framing — same lifecycle, same tickets, just not a thing
          a non-developer persona would describe. **Don't waste
          budget arguing whether plumbing 'counts as a feature' —
          ship it as ``kind: foundation``.**

      For each feature, name:
        - ``kind`` — capability or foundation (per above)
        - ``stack_span`` (frontend / backend / full-stack)
        - ``personas`` — at least one persona name from M1; for
          foundation features the persona is typically a developer
          (Maya, etc.) from a Caterpillar plumbing story
        - ``tickets`` — leave as an empty list; M3 will populate
        - ``tier`` (v1 / fast-follow / post-launch)
        - ``sources`` — story slugs this feature realizes

      Aim for 3–6 features. Multiple stories can converge on one
      feature when they describe the same capability from different
      personas; one story can split into multiple features when
      the persona's need spans distinct user-visible surfaces.

      **Cross-run note on the story pool you see.** The stories
      seeded into this meeting are only those *without* an existing
      feature sourcing them — the substrate filters out already-
      composed stories so M2 stays focused on uncomposed material.
      You may see existing features (in your project context or via
      cross-run grounding) whose ``Sources:`` reference story slugs
      that aren't in your seed pool. That's not a missing story; it's
      a story the substrate considers already-handled by its
      existing feature. Don't try to re-source those stories — the
      feature already realizes them. Focus your composition on the
      stories that ARE visible.

      **Silence is wrong here — your job is to produce features.**
      Without features, M3 has no input.

      **Alice — grounding voice.** You wrote the stories. Push back
      when a feature has drifted from a story your persona would
      recognize, or when a story you wrote has no feature serving
      it. Default to silence unless a grounding intervention is
      needed.

      **Caterpillar — composition pass.** For each feature Rabbit
      ships, ask: does this claim hold against the stories that
      sourced it? If a feature aggregates incoherent stories or
      makes a claim the stories don't support, surface the gap
      so Rabbit can revise.

    seeds:
      - from: any
        kinds: [project_context]
      # consumed_by: feature scopes M2 to *uncomposed* stories. On
      # cross-run design passes (operator iterating tdd-design 5–10×
      # against the same project, the workflow's economic argument),
      # stories from prior passes that already have features
      # sourcing them are dropped. Without this, Rabbit re-
      # composes the entire history into duplicate features —
      # observed in the May 10 obol mock-data design pass: M2
      # was renegotiating the prior run's stories instead of
      # focusing on the new mock-data ones.
      - from: scoping
        kinds: [story]
        consumed_by: feature

    transition_emitted_to: proposed
    phases:
      # Discussion phase has the same exit condition as commit — if
      # Rabbit has enough context to ship after one rotation of
      # alignment, he ships and discussion ends early. Without this,
      # discussion exhausts all 3 rotations before commit can fire,
      # and the meeting_budget runs out in concern/nudge ping-pong
      # before commit ever ships a feature artifact (observed in
      # the obol mock-data design pass: 19 calls of concerns + 0
      # features).
      - name: discussion
        max_rotations: 3
        exit_condition_artifact: feature
      - name: commit
        max_rotations: 2
        exit_condition_artifact: feature

  # ─────────────────────────────────────────────────────────────────
  # M3 — Tickets per feature. Rabbit decomposes one feature at a
  # time into v1 tickets. Per-feature iteration so each feature gets
  # focused decomposition.
  # ─────────────────────────────────────────────────────────────────
  - id: decomposition
    label: M3
    name: The Rabbit's Errand
    goal: decompose each feature into v1 tickets the Tweedles can pick up
    roster: [alice, white_rabbit]
    per_item: feature
    # Only decompose features that haven't been decomposed yet.
    # M2 emits feature → state proposed; M3 transitions →
    # in_design (after this iteration). On cross-run design
    # passes, features from prior runs are at designed (or
    # later); filter [proposed] correctly skips them. Without
    # this, M3 iterates over already-decomposed features and
    # ships duplicate tickets.
    iterate_only_in_states: [proposed]
    parallel: true  # T93: feature-level decomposition is structurally
                    # independent — feature A's tickets and feature B's
                    # never reference each other's payloads.
    meeting_budget: 0.30
    convenor_directive: |
      **Rabbit, decompose this feature into tickets.** The feature
      in your context is a user-facing capability; your job is to
      name the implementation atoms that ship together to deliver it.

      For each ticket, name:
        - ``title`` — what the ticket is, in one short phrase
        - ``owner`` — which Tweedle (tweedledee for frontend bias,
          tweedledum for backend bias, or "either" for full-stack)
        - ``tier`` (v1 / fast-follow / post-launch — usually
          inherits from feature tier)
        - ``stack_span`` — **REQUIRED**: one of ``frontend``,
          ``backend``, or ``full-stack``. The substrate uses this
          to scope M7 (implementation) to just the Tweedle whose
          side the ticket touches — frontend tickets only load
          Tweedledee, backend tickets only load Tweedledum,
          full-stack tickets load both. Don't default everything
          to ``full-stack`` to be safe; that defeats the whole
          point of the field. **Be explicit and stingy**:
            - ``frontend`` when the ticket's deliverable is a UI
              component, route, page, store action, frontend
              schema, client-side validation, etc. — code that
              lives under the frontend tree only.
            - ``backend`` when the deliverable is a model, API
              endpoint, migration, scheduled job, server-side
              validation, integration, etc. — code under the
              backend tree only.
            - ``full-stack`` ONLY when the ticket genuinely
              requires both sides to ship together as one unit
              (e.g. a new feature that needs a backend endpoint
              AND the frontend that calls it, where shipping
              one without the other leaves a broken half).
          If a frontend ticket needs a backend change to land
          first, that's a ``Blocked by:`` dependency on a
          SEPARATE backend ticket, not a reason to mark this one
          ``full-stack``. Splitting reduces M7 cost and clock time
          materially; merging defeats the optimization.
        - ``estimate`` (your honest read; the Tweedles will adjust)
        - ``description`` — what shipping this ticket means
        - ``sources`` — **REQUIRED**: the parent feature's slug must
          be the FIRST entry in this list. The substrate uses this
          link to know which tickets belong to which feature when
          tdd-implement iterates per-ticket. You may add additional
          source slugs (other features the ticket touches, story
          slugs the ticket realizes), but the parent feature comes
          first. Without this, the substrate can't tell which
          tickets to implement when the operator queues a feature.
        - ``acceptance`` — observable conditions of done

      Aim for 1–4 tickets per feature. A feature with 0 tickets is
      a feature that's not actually decomposed; a feature with 6+
      tickets is probably actually 2 features that should be split
      back in M2. (M2 is closed by now; if you find this, ship the
      tickets you have but flag the feature for re-composition in
      a future design run.)

      **Alice — same grounding role.** Defend the user-facing point
      of the tickets. Push back when a ticket compresses a story
      past user-recognition or drifts toward technical convenience.

    seeds:
      - from: any
        kinds: [project_context]
      - from: scoping
        kinds: [story]
      - from: composition
        kinds: [feature]

    transition_iteration_to: in_design
    # Single-phase with exit_condition: ticket. As soon as Rabbit
    # ships the first ticket, the meeting can exit; Alice's
    # grounding pushback shows up as concerns during the rotations,
    # not as a separate phase. Squathero already came in well under
    # budget at this meeting (\$0.02-\$0.08 per feature) so the
    # rotation budget tightening is precautionary, not a cost-cut.
    phases:
      - name: decompose
        max_rotations: 2
        exit_condition_artifact: ticket

  # ─────────────────────────────────────────────────────────────────
  # M3.5 — Consolidation per feature. Rabbit + Caterpillar review the
  # decomposed tickets, prune duplicates, and assign explicit blocked-
  # by dependencies. Right time to do this is immediately after M3
  # while the tickets are fresh in mind, and before M4's architecture
  # work which would otherwise be done against an over-decomposed
  # ticket set.
  #
  # Cuts downstream cost: a feature decomposed into 13 overlapping
  # tickets in M3 (squathero's migration feature, obol's cash-flow
  # monolith) becomes 5-7 right-sized tickets here. M6/M7/M8 then
  # iterate over the smaller set, which dominates implementation
  # spend. Pays for itself ~3-5×.
  #
  # Mechanism: agents have ``delete_file`` tool access to drop
  # duplicate ticket files directly, and re-emit ``ticket`` artifacts
  # with updated ``Blocked by:`` lines for surviving tickets. No new
  # artifact kind — the consolidation IS the resulting on-disk
  # ticket set.
  # ─────────────────────────────────────────────────────────────────
  - id: consolidation
    label: M3.5
    name: A Caterpillar's Edit
    goal: |
      consolidate this feature's tickets — merge overlaps, prune
      duplicates, and assign explicit blocked-by dependencies so
      M7 can serialize implementations of dependent tickets
    roster: [white_rabbit, caterpillar]
    per_item: feature
    iterate_only_in_states: [in_design]
    parallel: true
    meeting_budget: 0.30
    convenor_directive: |
      **Rabbit — ship ``ticket`` decisions only. Do NOT emit a
      ``feature`` decision in this meeting.** This is the trap: the
      iteration item IS a feature, but the meeting's job is
      consolidating its TICKETS. M2 is closed; you don't ship
      features here. Every emission you make in this meeting is a
      ``ticket`` decision (or ``concern`` / ``silence`` / ``question_to_operator``
      when something else applies).

      M3 just decomposed this feature into tickets and two failure
      modes are common at M3: over-decomposition (one capability
      sliced into 8 micro-tickets that should be 3) and missing
      dependencies (no explicit ``Blocked by:`` so M7 implementations
      race on shared foundations). M3.5 fixes both per feature.

      **What ``ticket`` emissions to make:**

        - **Tickets you want to keep AS-IS** with no changes: don't
          re-emit them. Just leave them alone.
        - **Tickets you want to MERGE**: ship a new ``ticket``
          decision with the merged content (combined acceptance,
          broader description, union of sources from the absorbed
          tickets). Caterpillar will delete the absorbed ones.
        - **Tickets whose ``Blocked by:`` needs updating** (this is
          the dependency-assignment goal of the meeting): ship a
          new ``ticket`` decision with the existing slug, the
          existing content, and a fresh ``dependencies.blocked_by``
          list naming the upstream ticket slugs.

      **Assigning ``Blocked by:`` is the load-bearing job.** Walk
      this feature's tickets. For each one ask: which other
      tickets' implementations does this need on disk before it
      can start? A ticket that calls ``apply_migrations()`` is
      blocked_by the ticket that defines it. M7 reads these to
      serialize dependent implementations — without them, dependent
      tickets race against half-built foundations and produce
      duplicate divergent code. Be explicit.

      **Caterpillar — prune duplicates with ``delete_file``.** You
      have the file-deletion tool; Rabbit doesn't. After Rabbit
      re-emits a merged ticket, the OLD ticket files (the absorbed
      slugs) are still on disk. Use ``delete_file`` on
      ``.wonderland/tickets/<old-ticket-file>.md`` to remove them.
      Same for tickets that should drop entirely without
      replacement (genuine duplicates Rabbit didn't re-emit).

      Verify before deleting: a ticket whose slug appears as a
      ``Sources:`` entry on a still-surviving sibling is fair game.
      A ticket whose acceptance criteria a sibling doesn't actually
      absorb is NOT — push back as a concern instead of pruning.

      **Aim for 3-7 tickets per feature after consolidation.** A
      feature with 8+ tickets after M3.5 is probably actually two
      features that should split back at M2 (flag as a concern; M2
      is closed but the operator can re-run design).

      **Silence is okay if there's nothing to consolidate** — a
      feature with 3 well-scoped tickets and no merge-or-deps work
      to do is fine to leave untouched. Don't manufacture
      consolidation just because the meeting opened.

    seeds:
      - from: any
        kinds: [project_context]
      # Feature binding stays on its own so the iteration-kind slice
      # keeps only THIS lane's feature artifact (current_item_slug
      # match against feature.payload.slug).
      - from: any
        kinds: [feature]
      # Tickets from the decomposition meeting, lane-scoped via the
      # per_item paired-suffix rule (decomposition-<feature_slug>).
      # Critical to split this from the feature binding above:
      # combining them as ``kinds: [feature, ticket]`` triggers the
      # iteration-kind slice (because ``feature`` is the iteration
      # kind), which drops every utterance that lacks a matching
      # feature artifact — including M3's ticket-only emissions.
      # Squathero2's first M3.5 run hit this: 5 of 6 lanes opened
      # with zero tickets in their context, so Rabbit had nothing
      # to consolidate and reverted to M2 muscle memory (re-emitting
      # the parent feature instead of shipping ``ticket`` decisions).
      - from: decomposition
        kinds: [ticket]

    # Single-phase with the same exit-on-artifact + tighter rotations
    # pattern as the rest of the workflow. Exit on ticket emission —
    # if Rabbit's first emission is the consolidated set, no need
    # to keep rotating. (Multi-emission cases — Rabbit drops a few
    # tickets THEN re-emits with deps — fall through to max
    # rotations cleanly.)
    phases:
      - name: consolidate
        max_rotations: 2
        exit_condition_artifact: ticket

  # ─────────────────────────────────────────────────────────────────
  # M4 — Architecture + security. Cat ADR + Queen ruling, both
  # grounded in concrete features + tickets. Single project-wide
  # meeting; doesn't transition individual features (architecture
  # commitment isn't per-feature).
  # ─────────────────────────────────────────────────────────────────
  - id: architecture
    label: M4
    name: A Mock Turtle's Lament
    goal: |
      produce architectural commitments (ADRs) and security rulings,
      grounded in the features + tickets the team has shipped
    roster: [alice, cheshire_cat, queen_of_hearts]
    meeting_budget: 0.40
    convenor_directive: |
      The features + tickets are settled. Now the team commits to
      the architectural shape that delivers them.

      **First, re-read the operator's directive in your context.**
      The directive seed is the operator's literal launching prompt
      — read it before drafting the ADR. Stack constraints named
      there (e.g. "TUI", "CLI", "mobile app", "web app") are
      non-negotiable architectural commitments. If the directive
      says "TUI" and you're considering a frontend/backend split,
      stop — the directive constrains the runtime shape, and the
      ADR must serve it. Stories paraphrase; the directive is
      verbatim.

      **Cat — write ADR(s).** Each ADR names a structural decision
      (storage shape, integration patterns, data flow) with explicit
      tradeoffs (what the alternative would have been + why we're
      not choosing it). Ground every claim in the directive +
      features + tickets; don't architect for hypothetical
      extensions. Use status "Proposed" so M5 can challenge if
      contracts can't realize the ADR.

      **Queen — security ruling pass.** For each feature, name the
      threat model: what's the attack surface, what could go wrong,
      what's the team committing NOT to do (deferred to fast-follow
      vs. accepted as inherent risk). One ruling per feature where
      the threat model is non-trivial; skip features with no
      meaningful security posture.

      **Alice — grounding voice.** Push back when an architectural
      decision drifts from the user-facing point of the features
      it supports OR drifts from the operator's directive. The
      architecture serves the personas + the directive's runtime
      shape, not the other way around.

    seeds:
      # Project context memory — authoritative project-level facts
      # (stack, entry point). When the skeleton populated it on
      # apply, Cat reads "runtime: tui" as a hard constraint and
      # can't drift into frontend/backend split language. Falls
      # through gracefully when the project predates context
      # memory (greenfield via legacy paths).
      - from: any
        kinds: [project_context]
      # Operator's literal launching prompt. Even when project
      # context names the stack, the directive carries intent for
      # *this* run — what feature, what scope. Cat reads both:
      # context for stack ground truth, directive for run intent.
      - from: any
        kinds: [directive]
      - from: scoping
        kinds: [story]
      - from: composition
        kinds: [feature]
      - from: decomposition
        kinds: [ticket]
    # exit_condition mirrored to discussion + tightened rotations.
    # Squathero produced 11 ADRs at this meeting for \$1.48 (≈3.7×
    # the \$0.40 budget) — Cat kept shipping ADRs because nothing
    # exits the meeting. With exit on first ADR, Cat ships one
    # well-grounded architectural commitment; further architectural
    # decisions come from operator-driven re-runs of M4 rather than
    # one mega-meeting that produces 11 overlapping ADRs.
    phases:
      - name: discussion
        max_rotations: 2
        team_groupings: [[cheshire_cat, queen_of_hearts, alice]]
        exit_condition_artifact: adr
      - name: commit
        max_rotations: 1
        team_groupings: [[cheshire_cat, queen_of_hearts, alice]]
        exit_condition_artifact: adr

  # ─────────────────────────────────────────────────────────────────
  # M5 — Contracts per feature. Tweedles negotiate seams informed
  # by the ADR. Per-feature iteration.
  # ─────────────────────────────────────────────────────────────────
  - id: contract-negotiation
    label: M5
    name: The Pair Protocol
    goal: negotiate per-feature contracts informed by the ADR
    roster: [tweedledee, tweedledum, alice]
    per_item: feature
    # Only contract features that have been decomposed but not
    # yet contracted. M3 transitions feature → in_design; M5
    # transitions → designed. On cross-run design passes,
    # features from prior runs are at designed (or later);
    # filter [in_design] correctly skips them. Without this,
    # M5 re-negotiates contracts that already exist and ships
    # duplicate contract notes.
    iterate_only_in_states: [in_design]
    parallel: true  # T93: contracts negotiate per-feature seams
                    # independently. Feature A's API shape and
                    # feature B's UI envelope are separate concerns.
    meeting_budget: 0.40
    convenor_directive: |
      **Tweedles — negotiate the contract for this feature.**

      **First, read project_context (in your seed context) for the
      runtime shape.** Your role names ("tweedledee = frontend
      bias", "tweedledum = backend bias") describe a division of
      labor that interprets DIFFERENTLY in different runtimes.
      Translate before negotiating:

        - ``runtime: tui`` (single-process terminal app):
          tweedledee = widget / screen / layout layer; tweedledum
          = data / model / persistence layer. The boundary between
          you is module imports, not HTTP. Contracts that name
          REST endpoints, fetch shapes, response envelopes, or
          cache-TTL semantics across this boundary are wrong —
          you're inside the same process. Use function signatures,
          dataclass shapes, and module-level invariants.

        - ``runtime: cli`` (single-shot command-line):
          tweedledee = argparse / output formatting; tweedledum =
          subcommand logic + persistence. Same in-process rule:
          no HTTP between you.

        - ``runtime: web`` (client-server, browser + service):
          legacy interpretation applies. tweedledee owns the
          browser surface, tweedledum owns the API service, the
          boundary IS HTTP, contracts name endpoints + verbs +
          response envelopes.

        - ``runtime: service`` (long-running daemon, no UI):
          tweedledum carries; tweedledee may not be relevant.

      If the directive named a runtime the project_context block
      doesn't list, default to single-process unless the directive
      explicitly says client-server.

      Read the feature, its constituent tickets, and the ADRs in
      your context. Produce contract notes that name the seams in
      the right shape for the runtime: function signatures + data
      classes for in-process; endpoints + envelopes for HTTP.
      Contracts are the bridge from architectural intent (ADR) to
      per-ticket implementation work (next phase).

      Stack span (the feature's own ``stack_span`` field) guides
      who leads, AS INTERPRETED through the runtime above:
        - ``full-stack`` features: both negotiate the seam together
        - ``frontend`` features: tweedledee leads, tweedledum confirms
        - ``backend`` features: tweedledum leads, tweedledee confirms

      A contract note carries: ``proposed_change`` (required, non-
      empty — what shape are we committing to?), ``current_shape``
      (the existing contract or "n/a, fresh feature"), and
      ``rationale`` (why this shape and not the obvious alternative).

      **Alice — grounding voice.** Push back when a contract
      compresses the user-facing point of a feature past
      recognition, OR when a contract drifts from the runtime
      shape (HTTP language in a TUI project, etc.). Default to
      silence; engage when a seam decision threatens a story your
      persona would recognize OR threatens the runtime fact in
      project_context.

    seeds:
      # Project context memory — runtime shape is the FIRST thing
      # the Tweedles read so their division of labor adapts to
      # the project's actual architecture (analysis 040 / r42-obol
      # post-fix: ADR was framework-agnostic but contracts still
      # drifted to HTTP because role-shape was fixed in their
      # constitutions and not in M5's frame).
      - from: any
        kinds: [project_context]
      - from: any
        kinds: [directive]
      - from: composition
        kinds: [feature]
      - from: decomposition
        kinds: [ticket]
      - from: architecture
        kinds: [adr, ruling]

    transition_iteration_to: designed
    # Same fix as M4/M6/M7/M8: exit_condition mirrored to discussion
    # so the meeting ends as soon as the Tweedles ship a contract
    # note instead of rotating through max_rotations regardless.
    # Squathero ran 7 parallel M5 lanes at \$0.50-\$0.66 each
    # (≈1.5× the \$0.40 budget) — fix should bring most lanes to
    # the budget ceiling.
    phases:
      - name: discussion
        max_rotations: 2
        team_groupings: [[tweedledee, tweedledum, alice]]
        exit_condition_artifact: contract_note
      - name: commit
        max_rotations: 1
        team_groupings: [[tweedledee, tweedledum, alice]]
        exit_condition_artifact: contract_note
