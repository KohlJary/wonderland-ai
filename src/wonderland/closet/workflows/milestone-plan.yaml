name: milestone-plan
description: |
  Planning phase (P15). Operator runs this after discovery; three
  agents (White Rabbit + Cheshire Cat + Alice) read the requirement
  corpus + any existing milestone plan and propose an ordered
  sequence of milestones. Each milestone names which requirements
  it consumes + what observable signal means it's done.

  ## Why this exists

  Without milestones, M2 (composition) in tdd-design sees all
  requirements at once and composes features against a flat pool —
  some are foundation work (data layer, profile shell), some are
  user-facing (logging UI, gamification), some are deferred
  follow-ons. The features end up unordered and tdd-implement
  can't sequence them sensibly.

  Milestones inject an explicit ordering layer: foundation
  ships first, the core loop second, gamification third, etc.
  Each tdd-design run scopes to one milestone via
  ``--milestone <slug>`` and produces features inside that
  milestone's frame.

  ## Cross-run continuity

  Re-running this workflow after a follow-up discovery should
  AMEND the existing plan, not replace it. The seed shape pulls
  existing milestones from
  ``.wonderland/milestones/`` and presents them alongside the
  new requirements. Agents re-emit existing milestone slugs to
  update them (adding newly-arrived requirements, tightening a
  done_when, etc.) and coin new slugs to append. The registry
  dedups by slug — same slug = overwrite, new slug = append.

  ## Roles

  - **White Rabbit** owns the canonical plan. Alice + Cat push
    back from their lenses; Rabbit's milestones are what the
    substrate records.
  - **Cheshire Cat** checks architectural ordering — flags when
    a proposed order would have M4 architecting against a
    foundation that hasn't shipped.
  - **Alice** grounds in persona-shipped value — flags when a
    proposed order would have the persona seeing something
    incomplete-feeling before something complete-feeling.

  Target 3-7 milestones for a v1 cut. More than that and the
  operator loses track; fewer than that and milestones aren't
  pulling their weight as a sequencing layer.

version: 1

category: planning

defaults:
  # Planning is cheap — one meeting, three agents, two phases.
  # Most of the cost is in reasoning about an existing requirement
  # corpus; the agents don't generate much new structured content
  # per turn (a milestone is ~5 fields + a list of slugs).
  budget_dollars: 1.50
  quiescence_seconds: 60.0

meetings:

  # ─────────────────────────────────────────────────────────────────
  # The single planning meeting. Three agents, two phases.
  # ─────────────────────────────────────────────────────────────────
  - id: planning
    label: P1
    name: The Caucus on the Map
    goal: |
      compose the milestone plan from the requirement corpus —
      ordered, with done-criteria, scoped to consumed requirements
    roster: [white_rabbit, cheshire_cat, alice]
    # Rabbit is the primary author for milestone_plan. Alice + Cat
    # stay on the roster to support with concerns / observations /
    # questions, but their milestone_plan emissions get cleaned up
    # at snapshot time via _apply_milestone_plan_snapshot's
    # primary-speaker filter. Mvp-demo pilot surfaced the need:
    # Alice's persona-anchored milestones and Rabbit's technical-
    # layer milestones both survived in parallel at the same orders
    # (different slugs at same orders), producing 9 milestones for
    # 5 conceptual positions. Single-author keeps the plan
    # internally consistent.
    primary_speaker: white_rabbit
    meeting_budget: 1.50
    # P15 T-m6 stage-leak guardrail. The convenor_directive below
    # tells agents what to ship; this list is the substrate-side
    # enforcement that catches what slips past. milestone_plan is
    # the productive output; concern + question_to_operator are
    # valid push-back / clarification shapes; question lets agents
    # ask each other for context; deference + silence are first-
    # class no-ops. Everything else (ticket, feature, story, ADR,
    # interview_review, etc.) gets the artifacts stripped + their
    # on-disk files deleted before reaching the bus.
    allowed_decisions:
      - milestone_plan
      - concern
      - deference
      - silence
    # NOTE: ``question`` and ``question_to_operator`` are
    # deliberately EXCLUDED. First two observed runs got stuck
    # in a loop of agents asking each other questions instead of
    # committing. T-m6's filter is artifact-level (it doesn't drop
    # question utterances since they carry no artifacts), so this
    # list mostly serves as a hint — the load-bearing forcing
    # function is the convenor_directive's "DO NOT ask each other
    # questions" section. If the loop persists, T-m6 wants
    # expanding to utterance-level filtering.
    convenor_directive: |
      **Rabbit is the primary author for this meeting's
      `milestone_plan`. Alice + Cat support with concerns,
      observations, and questions — but do NOT emit
      `milestone_plan` yourselves.** The substrate enforces this
      via the meeting's `primary_speaker` field: any
      `milestone_plan` emissions from non-primary speakers get
      snapshot-cleaned at meeting end. You'll burn budget for no
      result. Alice's role is to keep Rabbit's plan grounded in
      persona-anchored user journeys; Cat's role is to flag
      architectural seams Rabbit's plan implies. Both happen via
      `concern` or `observation`, not via parallel `milestone_plan`
      emissions.

      **Rabbit — THE ONLY PRODUCTIVE OUTPUT OF THIS MEETING IS YOUR
      `milestone_plan` DECISION.** That's your assignment. Read
      the requirement corpus, compose an ordered plan, ship it
      as `milestone_plan` with the `milestones` field populated.

      Example of what your response should look like:

      ```json
      {
        "decision": "milestone_plan",
        "body": "First cut: foundation → core loop → gamification. Marcus needs the logging foundation before XP bars make sense.",
        "milestones": [
          {
            "slug": "foundation",
            "name": "Foundation: data layer + profile shell",
            "order": 1,
            "kind": "foundation",
            "goal": "Marcus can launch the app, create a profile, and the persistence layer is ready for the logging loop.",
            "done_when": [
              "App launches on a fresh machine",
              "Profile creation works + persists across restart"
            ],
            "consumes_requirements": [
              "marcus-late-20s-software-engineer-post-work-gym-sessions",
              "marcus-moving-from-pen-and-paper-notebooks-to-digital-tracking",
              "local-storage-is-sqlite-file-based-single-device-multi-profile-capable",
              "multi-user-local-profiles-no-authentication-in-v1",
              "deployment-flexibility-offline-first-cloud-as-follow-on"
            ],
            "deferred": false,
            "confidence": "operator_stated"
          }
        ]
      }
      ```

      **DO NOT ship any of these decisions in this meeting:**
        - **NO `story`** — story composition happens in tdd-design
          M1, scoped to a milestone, not here. Stories are NOT
          milestones; they're persona-anchored need statements
          that downstream design will derive.
        - **NO `interview_questions`** — this is NOT a discovery
          meeting. The interviewing is done; the requirements are
          on disk. Don't ask the operator anything; compose the
          plan from what's already there.
        - **NO `ticket`** — decomposition into tickets happens in
          tdd-design M3, not here. Even if you can see what
          tickets a milestone will need, ship the milestone alone.
        - **NO `feature`** — feature composition happens in
          tdd-design M2, scoped to one milestone at a time, not
          here. The milestone's `done_when` conditions are NOT
          features; they're operator-observable signals.
        - **NO `proposal` / ADR** — architectural commitments
          happen in tdd-design M4 with the milestone's
          requirements visible. Ship a `concern` if you spot an
          architectural problem with the proposed ordering.
        - **NO `test_scenario`** — testing concerns belong to
          tdd-implement, not here.

      The valid response shapes for this meeting are exactly:
        - `milestone_plan` — your contribution to the canonical
          plan (productive output).
        - `concern` — push back on someone else's proposed order
          or coverage.
        - `question` — ask the team for context.
        - `question_to_operator` — escalate to the human when the
          team needs a decision only they can make (rare here —
          the operator already gave their answers via discovery).
        - `silence` — defer to the others; you have nothing
          load-bearing to add.

      Anything else — the substrate's stage-leak guardrail will
      drop the artifact + delete the on-disk file before it
      reaches the bus. The utterance survives as a transcript
      record but the work is wasted. Don't waste turns.

      **Rabbit — your FIRST turn in this meeting is a
      milestone_plan decision.** Don't ask questions. Don't ship
      a concern first. Don't wait for alignment with Cat or
      Alice. Read the requirement corpus, draft your best
      initial cut, ship it. Imperfect is fine — Cat and Alice
      will push back if your draft has issues. The substrate
      will record your milestones; subsequent turns can amend.

      **Cat — push back on Rabbit's draft via `concern`, OR
      ship your own competing `milestone_plan`.** Don't ask
      Rabbit clarifying questions. The requirements are
      settled — the operator already answered all the
      architectural seam questions during discovery + the
      interview meeting. If you see an ordering problem in
      Rabbit's draft, name it as a concern (1-2 sentences,
      pointed at a specific milestone slug). If you have a
      fundamentally different order in mind, ship your own
      `milestone_plan` and the substrate will record both
      versions (different slugs = both kept; same slug = your
      version overwrites Rabbit's).

      **Alice — push back via `concern` from the persona lens,
      OR ship your own competing `milestone_plan`.** Don't ask
      clarifying questions about persona shape — Marcus is
      Marcus. If Rabbit's order would have the persona seeing
      something incomplete-feeling before something
      complete-feeling, name the concern. If you'd order
      differently, ship your own milestone_plan.

      **Nobody asks the operator anything in this meeting.**
      Discovery is over. The requirements are settled. The
      operator has already given everything they're going to
      give until they review what this meeting ships. If a
      question feels load-bearing, write a milestone whose
      `goal` notes the open question — the operator will see
      it in the next dashboard review.

      **DO NOT ask each other questions.** Observed failure
      mode: Cat surfaces a "seam," Alice adds nuance, Rabbit
      summarizes, no one commits. Eleven question turns, zero
      milestones, meeting times out. Don't do that. If you have
      a position, ship it as `milestone_plan` or `concern`.
      Silence is also valid when you have nothing to add to a
      shipped draft.

      **Target shape:** 3-7 milestones, each with:
        - stable slug (re-emit to amend an existing milestone)
        - 1-indexed order
        - human-readable name
        - ``kind`` — ``foundation`` for infrastructure/contract
          milestones; ``capability`` for user-facing flows
        - 1-3 sentence goal
        - observable done_when conditions (concrete enough to
          check)
        - **rich** list of consumes_requirements (requirement
          citations scoped to this milestone — see Coverage below).
          Each citation is a slug (legacy), full GUID, or
          ``"<guid>:<slug>"`` (P18 canonical — guid resolves first).
          You'll see the requirement's guid on the bus + in its
          markdown ``**GUID:**`` line; prefer guid-prefixed
          citations when available.

      **Each milestone should ship a *coherent thing* —
      operator-observable, not just internal architectural
      plumbing.** The first milestone often is foundation
      (data layer + skeleton) and that's fine — but the
      done_when should describe an operator-visible outcome
      ("app launches, profile can be created and selected")
      not just "schema exists."

      **Milestone kind — foundation vs capability.** Every
      milestone gets a ``kind`` field with one of two values:

        - ``kind: foundation`` — sets up infrastructure the rest
          of the project depends on (schema, API contracts, seed
          data, build tooling, dev environment). The persona is
          typically a developer/operator/installer, not the
          end user. Done-when reads as "the project gains the
          ability to X." Usually the first milestone (sometimes
          more than one). The substrate runs Caterpillar solo on
          foundation scoping; Alice is filtered out because the
          user-facing narrative reflex isn't load-bearing here.
        - ``kind: capability`` (default) — delivers a user-facing
          flow the end persona can describe in one sentence. Done-
          when reads as "Marcus can do X." The substrate runs Alice
          solo on capability scoping; Caterpillar is filtered out.

      **You MUST produce a kind=foundation M1 when the requirement
      corpus contains ANY of:** persistence/storage constraints
      (SQLite-only, Postgres, local-only file storage),
      stack/language constraints (Python/Rich/Textual, React,
      specific framework choices), build/deploy plumbing
      requirements (5-minute clone-and-run, single-binary deploy,
      Docker), scale/consistency contracts (sub-500 notes,
      eventual consistency, ACID required), or dev environment
      shape (TUI, CLI, web server + frontend split). These need a
      coherent landing pass — schema designed, contracts frozen,
      dev environment scaffolded — BEFORE capability milestones
      consume them, because every capability milestone implicitly
      depends on these decisions.

      **Don't be confused by requirements tagged ``axis: both``.**
      Constraints like "SQLite-only" are honestly cross-cutting
      (capability work uses SQLite too), so Alice tags them
      ``both`` per discovery directive. That tag means "both
      lanes consume this requirement," NOT "no foundation
      milestone needed." A foundation milestone can and should
      consume ``axis: both`` constraints — they're the foundation
      milestone's main input. The check is: does the requirement
      shape match a foundation concern? If yes (persistence,
      stack, build, scale, consistency, environment), produce a
      foundation milestone to land it coherently, regardless of
      how the requirement is axis-tagged.

      **Observed failure mode (mvp-260522 + obol-260522 pilots):**
      both projects had clear persistence + stack + build
      constraints in their requirement corpus. Both produced ZERO
      foundation milestones because all constraints were
      ``axis: both``-tagged and the milestone planner read that
      as "no foundation work needed." Result: M1 ended up doing
      3-in-1 work (foundation + capability + skeleton) with no
      Caterpillar-solo scoping pass on the infrastructure layer.
      Don't be that pilot. The axis tag is descriptive (where
      the requirement applies); the milestone kind is
      prescriptive (where the WORK should land). They're
      orthogonal — produce foundation milestones based on the
      WORK shape, not the axis tag.

      **Foundation milestones consume INFRASTRUCTURE-shaped
      requirements only.** Requirement kinds that anchor in
      foundation:
        - ``persona``, ``situation`` — universal grounding (every
          milestone consumes these)
        - ``constraint`` — infrastructure constraints (storage,
          scale, deployment)
        - ``integration`` — API contracts, stack interop boundaries
        - ``stack_constraint`` — runtime / framework choices
        - ``scope`` — what v1 means at the infra layer
        - ``out_of_scope``, ``deal_breaker`` — bounds

      **Foundation milestones MUST NOT consume USER-FACING
      capability requirements.** Specifically: never put a
      requirement of kind ``success_criterion`` or a
      behavior-shaped requirement (the ones that read as "user
      can search/edit/filter/etc.") in a foundation milestone's
      consumes list. **Even if the foundation milestone STUBS
      the endpoint or schema for that capability, the requirement
      itself belongs to the capability milestone that ships the
      behavior.** Observed failure mode (mvp-demo-rerun M1):
      milestone-plan included ``search-and-filter-compose-tag-
      filter-then-search-within`` in M1's consumes because M1
      stubs the ``GET /notes/search`` endpoint. The endpoint stub
      is M1's job; the SEARCH CAPABILITY is M3's job. Putting the
      search requirement in M1's consumes confused downstream
      design — agents read the requirement as M1's marching
      order and tried to deliver the search capability inside the
      foundation milestone. The right split: M1 lists the endpoint
      stubs in its done_when (operator-observable: endpoints
      return 501 with the right contract shapes) without claiming
      the user-facing capability requirement; M3 consumes the
      search requirement and ships the actual delivery.

      Quick test: if a requirement reads as "user can do X,"
      it goes in the milestone that DELIVERS X, not the one
      that prepares infrastructure for X. If the milestone-plan
      agent isn't sure, default to placing it in the capability
      milestone and let the foundation milestone reference it
      only via done_when prose.

      **Coverage discipline — every requirement gets a home.**
      Look through your context seed-by-seed. Each requirement
      (you'll see one ``(artifacts: requirement slug=...)``
      annotation per seed utterance) must appear in at least one
      milestone's ``consumes_requirements`` list. Multi-milestone
      membership is expected and good:

        - **Persona + situation requirements** (Marcus, gym-floor
          moment, etc.) typically appear in EVERY milestone that
          ships something Marcus would touch. Don't list them in
          only one — they're the universal grounding.
        - **Cross-cutting constraints** (offline-first, SQLite,
          deal-breakers) typically appear in every milestone they
          bound — repeat the slug if the constraint is
          load-bearing for that milestone.
        - **Scope requirements** anchor to the milestone whose
          done_when they describe.
        - **Out_of_scope + deferral requirements** anchor to the
          milestone they explicitly bound (e.g.,
          ``out_of_scope: fitness-tracker-integration`` lives in
          the first milestone that would have touched fitness
          trackers, marking the boundary).

      Before you ship the plan, do a coverage pass: walk the
      requirement seeds in your context one more time and confirm
      each has a home. If a requirement genuinely doesn't fit any
      milestone, ship a ``concern`` calling that out — it's a
      planning gap worth surfacing.

      **Aim for richness over minimalism in consumes_requirements.**
      A milestone with one requirement is a planning failure —
      downstream design (tdd-design --milestone <slug>) will starve
      on thin seeds. Two requirements per milestone is a floor;
      five to ten is typical for a meaningful foundation /
      capability slice.

    seeds:
      # Project context — the directive + skeleton + stack facts
      # that frame everything. Cheap to include; downstream
      # planning decisions benefit from grounding.
      - from: any
        kinds: [project_context]
      # Requirement corpus from disk. Discovery has already run
      # (or operator hand-edited markdown); the planning meeting
      # composes against this pool.
      - from: any
        kinds: [requirement]
      # Existing milestones — cross-run continuity. First-run
      # finds nothing (empty); re-runs surface the prior plan so
      # agents can amend rather than restart.
      - from: any
        kinds: [milestone]

    phases:
      # Single phase — no discussion-before-commit. First
      # observed run pattern was Cat surfacing a seam, Alice
      # adding nuance, Rabbit asking the operator, getting an
      # answer, Cat surfacing another seam, infinitely. The
      # team treated planning like an architecture meeting (M4)
      # and never converged.
      #
      # NO exit_condition_artifact: the third observed run had
      # Rabbit ship a milestone_plan on turn 1, then the phase
      # exited immediately because the exit_condition fired —
      # Cat and Alice never got their turn to refine. The two
      # rotations give each agent ONE turn to ship their initial
      # position and a second turn to amend / push back. Phase
      # ends naturally on rotation cap or when everyone passes
      # in succession (registered quiescence).
      - name: plan
        max_rotations: 3
        # P15 T-m8 — closed-loop coverage check. After each rotation
        # the substrate verifies every decomposable requirement is
        # consumed by some milestone; gaps trigger a synthetic Dodo
        # observation listing the orphan slugs + grant a bonus
        # rotation so Rabbit can revise. Bonus rotations are capped
        # by ``coverage_max_extra_rotations`` (default 2 on Meeting).
        # End-of-phase outcome is COMPLETE when coverage closes,
        # COVERAGE_INCOMPLETE when the cap exhausts with gap
        # remaining — operator notices the difference in the
        # MeetingEndEvent.
        coverage_check: requirement_coverage
