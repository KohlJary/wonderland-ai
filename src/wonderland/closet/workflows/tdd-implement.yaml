name: tdd-implement
description: |
  Implement-phase atom of the TDD pipeline. Operates on features
  designed by tdd-design that the operator has explicitly queued
  for implementation. Hatter writes failing tests + Tweedles make
  them pass per ticket; Caterpillar reviews per feature. Output:
  features in lifecycle state ``ready_for_review``, awaiting
  operator verification.

  ## Input filter

  Only iterates over tickets whose parent feature is in lifecycle
  state ``queued`` (T86 ``iterate_only_in_states``). Features in
  ``designed`` but not yet queued get skipped silently — the
  operator's queue gate is the explicit signal "implement these
  now." Run tdd-design first to produce designed features; pick a
  batch via the dashboard's Features tab; then run tdd-implement.

  ## TDD red-green-refactor structure

  Tea Party (M6) is per ticket: Hatter writes a failing test +
  Tweedle commits to an implementation contract for that ticket.
  Implementation (M7) is per ticket: the responsible Tweedle ships
  code that makes the test pass. Review (M8) is per feature:
  Caterpillar evaluates the cohesive feature deliverable, including
  cross-ticket consistency.

  Per-iteration granularity is deliberately small. Per T88-note
  (analysis 040 thread), tickets are the natural atomic unit —
  the rotation cap was always calibrated for ticket-scope work,
  even when the previous workflow named features as the iteration
  unit. With tickets as the iteration unit, Rabbit's feature-
  composition decisions don't silently override the orchestrator's
  budget calibration.

  ## Output

  - Test files (Hatter's failing tests, then Tweedles' passing tests)
  - Implementation code in src/ (or skeleton-equivalent paths)
  - Review notes per feature (Caterpillar's verdict + concerns)
  - Features end up in lifecycle state ``ready_for_review`` (M8 fires
    transition_iteration_to: ready_for_review per feature)
  - Operator gates ``ready_for_review → verified | rejected``;
    that's not part of this workflow, that's the human verify step
    via T90's TUI flow

version: 1

defaults:
  budget_dollars: 8.00
  quiescence_seconds: 300.0

# Pipeline mode: two-level. Features run sequentially (one feature
# at a time); within each feature, tickets flow through M6 → M7 in
# true parallel pipeline (ticket A finishing M6 starts M7 while
# ticket B is still in M6). M8 runs once per feature after all
# per-ticket lanes finish.
#
# Why feature-sequential, ticket-parallel (the inverse of the
# original single-level shape):
#   - Tickets within a feature are typically more separable
#     (backend ticket touches src/api, frontend touches src/ui) so
#     parallel ticket execution races on src/ files less than
#     parallel feature execution would.
#   - Feature-sequential keeps the operator's mental model focused:
#     watch one feature flow through start to finish, then the next.
#   - The barrier at M8 (per-feature review) is a natural sync
#     point — Caterpillar reviews the cohesive feature deliverable
#     after all tickets converge.
#
# Cross-lane isolation: thread ids are namespaced
# pipe.{feature_slug}.{meeting_id}-{ticket_slug}, and seed
# resolution drops utterances from other lanes' threads. Lane A's
# M8 reviewing feature-A's deliverable doesn't see lane B's M6
# test scenarios for feature-B (when features run sequentially
# this matters less, but the scoping still applies for safety).
#
# File-level safety: M7 ships actual src/ code. Tweedles use diff-
# based writes (str_replace) for surgical edits. With ticket-
# parallel within a feature, two tickets touching the same file
# remains the principal risk; first-run-of-this-shape data will
# tell us whether per-feature serialization (the design choice
# above) is enough or whether finer-grained locking is needed.
pipeline:
  levels:
    - per_item: feature
      parallel: false  # features sequential — one feature at a time
      iterate_only_in_states: [queued, in_progress]
    - per_item: ticket
      parallel: true  # tickets within a feature run in true pipeline

meetings:

  # ─────────────────────────────────────────────────────────────────
  # M6 — Tea Party per ticket. Hatter writes a failing test, Alice
  # grounds it in the persona's acceptance criteria. The "red" of
  # TDD's red-green-refactor.
  #
  # Roster history: [hatter, dee, dum] → [hatter, alice]. The
  # Tweedles' contribution at M6 was implementation pressure
  # (anti-productive at red phase — pushes Hatter toward "what's
  # a test we can pass quickly" rather than "what's a test that
  # captures the acceptance criterion"). Alice's pushback is
  # persona-shaped — "would the persona recognize this assertion?" —
  # which is the right grounding for test design. Tweedles see the
  # test_scenario artifact when they enter M7 and can buzz in via
  # their selectively-engaging §III rules if Hatter ships a test
  # that contradicts their M5-negotiated contract.
  # ─────────────────────────────────────────────────────────────────
  - id: tea-party
    label: M6
    name: A Mad Tea Party
    goal: |
      produce a failing test grounded in the ticket's acceptance
      criteria — the red phase of TDD's red-green-refactor loop
    roster: [mad_hatter, alice]
    per_item: ticket
    # Filter spans queued + in_progress because the per-iteration
    # transition (queued → in_progress on first ticket) would
    # otherwise cause subsequent tickets of the same feature to be
    # dropped — the parent feature flips state mid-meeting-set.
    # Both states represent "feature is being worked on or about
    # to be"; both should pass.
    iterate_only_in_states: [queued, in_progress]
    # Skip tea-party for tickets whose source/test-design markers
    # say adversarial scenario design isn't warranted —
    # review-synthesized tickets (the Caterpillar's
    # location/quote/concern/request IS the spec), or any ticket
    # explicitly marked `test_coverage_required: false`. Cost
    # optimization that shaves ~$0.50/ticket on review-pass
    # follow-ups. Caterpillar can override per-finding by setting
    # `test_coverage_required: true` on a finding, which the
    # synthesized ticket inherits — that ticket then passes through
    # tea-party even though its source is review_synthesis.
    requires_test_design: true
    meeting_budget: 0.50
    # Entry meeting — the runtime still relays the user's directive
    # at the top, but we layer an explicit convenor_directive on top
    # to lock the artifact shapes per agent. Without it, Alice would
    # default to ``story`` (her natural M1 voice) and pollute the
    # user story pool with test-shaped stories like "As Maya, I want
    # the timeout case to be handled"; with it, she emits
    # ``test_scenario`` with her persona-anchored happy paths.
    convenor_directive: |
      **Tea party. Hatter ships failing tests grounded in the
      ticket's acceptance criteria. Alice grounds those tests in
      the persona's expected experience.**

      **Hatter — your job (`test_scenario`).** Surface the edges,
      failure modes, and degradations this ticket has to handle.
      Severity-triage every scenario; underclaim if anything. Aim
      to ship at least one failing-test artifact for this ticket
      this iteration; you can ship multiple if the ticket genuinely
      has multiple distinct edges.

      **Alice — your job (`test_scenario`, NOT `story`).** In the
      tea party you are NOT adding to the story pool — the stories
      that sourced this ticket are already shipped, and re-emitting
      them as more story artifacts pollutes the pool with
      test-shaped duplicates. Your move here is to write
      *happy-path* test scenarios from your persona's POV:
        - "Maya pastes a 200-char draft and expects the translated
          reply within 2s"
        - "Sam taps the Reply button after a 5-minute idle and
          expects their draft to still be there"
      Severity for happy paths is typically `silent-wrongness`
      (system returns the wrong thing) or `degradation` (system
      works but slower than the persona would tolerate). If you
      genuinely have nothing to add beyond Hatter's edges, choose
      `silence` — don't pad the thread. **Use `decision:
      "test_scenario"` with the `scenarios` array; do NOT use
      `decision: "story"` in tea-party threads, ever.**

      Both of you: every scenario you ship should be specific
      enough that a Tweedle reading it in M7 can write the failing
      test in code without ambiguity.

    seeds:
      - from: any
        kinds: [project_context]
      # Iteration-kind binding (ticket) is split out so the slice
      # in resolve_seeds keeps only THIS ticket's artifact for the
      # iteration. Non-iteration kinds get a separate binding so
      # they don't get dropped by the slice — without this split,
      # contract_note utterances (which carry no ticket artifacts)
      # are filtered out entirely and the Tweedles can't see the
      # contract decisions M5 made for the parent feature.
      - from: any
        kinds: [ticket]
      - from: any
        kinds: [feature, adr, ruling, contract_note]
      # Prior review artifacts — on a retry iteration after a
      # request-changes verdict, Caterpillar's findings need to
      # surface in seed context so Hatter knows which test
      # scenarios to revise. The parent-feature scoping in
      # resolve_seeds drops sibling features' reviews; cross-run
      # disk fallback picks up reviews from prior runs.
      - from: any
        kinds: [review]

    transition_iteration_to: in_progress
    # exit_condition on BOTH phases so the meeting ends as soon as
    # Hatter ships a test_scenario, not after rotating through red
    # AND commit. Pre-this-fix: red rotates to max even when scenario
    # ships, then commit needs ANOTHER scenario emission to exit
    # (which Hatter usually doesn't produce — he ships one scenario
    # per ticket). Result: meeting runs to budget cap on every iter.
    # Single-phase: red exits as soon as Hatter+Alice ship the
    # test_scenario. Pre-this-fix the meeting had a separate
    # "commit" phase running 1 rotation post-exit; that rotation
    # always added cost without adding value because the
    # exit_condition was already satisfied by the artifact in the
    # bus from red. Dropping commit removes that wasted rotation
    # without changing convergence semantics.
    phases:
      - name: red
        max_rotations: 2
        team_groupings: [[mad_hatter, alice]]
        exit_condition_artifact: test_scenario

  # ─────────────────────────────────────────────────────────────────
  # M7 — Implementation per ticket. Tweedles ship code that makes
  # Hatter's failing tests pass. The "green" of TDD red-green.
  # No transition fires here — feature stays in_progress until M8
  # reviews and transitions to ready_for_review.
  # ─────────────────────────────────────────────────────────────────
  - id: implementation
    label: M7
    name: The Tweedle Pair
    goal: |
      ship implementation code that makes the failing test pass —
      the green phase of TDD's red-green-refactor loop
    # Hatter intentionally NOT on M7's roster — he keeps shipping
    # new test scenarios during implementation despite directive
    # prose telling him to refine, not regenerate. His sprawling
    # nature is contained to M6 (Tea Party) where scenario
    # generation is the explicit job. If implementation surfaces
    # genuinely new edge cases, the Tweedles surface as a concern
    # and Caterpillar's M8 review handles it (or it becomes a
    # follow-up ticket back through M6).
    roster: [tweedledee, tweedledum]
    per_item: ticket
    iterate_only_in_states: [queued]
    meeting_budget: 0.70
    # Per-ticket roster narrowing based on the ticket's stack_span
    # (set by Rabbit during M3.5 consolidation, possibly refined by
    # Tweedles during M5 contract negotiation). Frontend-only
    # tickets only need Tweedledee; backend-only only need
    # Tweedledum. Full-stack tickets fall through to the full
    # roster. The non-roster Tweedle can still buzz in via their
    # constitution's §III selective-engagement when a contract
    # question surfaces — narrowing only affects who gets priority
    # windows, not who can emit.
    per_item_roster_filter:
      field: stack_span
      map:
        frontend: [tweedledee]
        backend: [tweedledum]
    # Gate on dependencies: a ticket whose code depends on another
    # ticket's implementation waits for that upstream ticket's M7
    # to finish before starting its own M7. M6 (Tea Party) still
    # runs all tickets in parallel because writing a failing test is
    # independent of the upstream's actual implementation.
    # Dependencies come from each ticket's ``- Blocked by:`` markdown
    # line. Squathero's last implementation run had 7 migration
    # tickets all running in parallel where most depended on the
    # foundational migration setup; result was 4 divergent partial
    # implementations of the same module. With this gate, the
    # foundation ticket finishes M7 first, then dependent tickets
    # see the actual code on disk before writing against it.
    gates_on_dependencies: true
    convenor_directive: |
      **Tweedles — make the failing test pass.** The ticket's owner
      ships the implementation. Code lives in non-test directories
      (src/ or its skeleton equivalent — production code lives
      under src/, tests under tests/, never inline in conftest.py
      or test_*.py).

      Run the tests after each meaningful change; iterate until
      green. Use the str_replace tool for incremental edits where
      possible (cheaper than write_file when you're only changing
      part of an existing file).

      The failing test from M6 is in your seed pool. Don't write
      new tests in this meeting — if the existing test needs
      refinement based on what implementation surfaces, surface as
      a concern; new tests are M6's job, not yours.

      Stay scoped to THIS ticket. If implementation surfaces
      cross-ticket coordination needed, surface as a concern;
      don't pull adjacent tickets' work into this iteration. The
      per_item: ticket scope is calibrated for atomic work.

      **Build against the structural contract (P21).** The Ophanic
      ``.oph`` diagrams in your context are this milestone's structural
      map — the UI component tree and the DB schema the design settled
      on. Your ticket realizes one or more of the components drawn there;
      the component is named after what your ticket builds (a "weather
      card" ticket realizes the ``◆WeatherCard`` node, a "users table"
      ticket realizes ``◆UsersTable``). Find yours in the diagram, then:

        - **Match its place in the tree.** If the diagram shows
          ``◆WeatherCard`` nested inside ``◆CardGrid`` inside the
          dashboard, your weather card is a child rendered by that grid —
          not a standalone page. Keep the component name the diagram uses;
          it's the contract the reviewer checks your code against.
        - **WIRE IT IN — this is the load-bearing rule.** A component that
          exists as a file but is never mounted into its parent is a
          HOLLOW build: it passes its own unit test and ships nothing the
          user can actually see. Your implementation is NOT done until the
          component is really composed at the position the diagram shows —
          the dashboard imports and renders the WeatherCard, the router
          mounts the page, the endpoint is registered on the app. Building
          the leaf without connecting it to the trunk is the exact failure
          this structural layer exists to prevent. If you can't wire it in
          because the parent isn't built yet, say so as a concern — don't
          ship an orphaned component and call it green.

      **Follow the project conventions charter.** The "Project
      Conventions" ADR in your context is the law for cross-cutting
      choices — boolean/timestamp field names, the publishable shape,
      the route scheme (`/admin/*` vs `/public/*`), what a client does
      on 401, the standard error envelope. Match them EXACTLY: an
      adjacent feature already built to them, and yours must agree or
      the codebase drifts (its publish flag becomes `is_published`
      while yours is `published`). Where the charter names a SHARED
      PRIMITIVE — an API client with a 401 interceptor, a `Publishable`
      mixin, one upload helper — USE IT; don't hand-roll your own. If
      the primitive doesn't exist yet and your ticket is the first to
      need it, BUILD it as the charter describes so the next feature
      consumes it instead of reinventing it.

    seeds:
      - from: any
        kinds: [project_context]
      # tickets + contracts come from disk via seed-fallback; tea-party
      # output (test_scenarios) lives on the bus in this run.
      # Same iteration-kind-slice fix as M6: split ticket (iteration
      # kind, gets sliced to current ticket) from contract_note
      # (passes through unfiltered so the Tweedles see the parent
      # feature's contract decisions).
      - from: any
        kinds: [ticket]
      # Context-compression Lever C — tail bounds the contract-note
      # pool. A feature with many contract iterations accumulates
      # contract-notes across rounds of M5 / M8 follow-up; the
      # MOST RECENT 5 are load-bearing (current shape + recent
      # amendments). Older ones compound context-replay cost on
      # every tool-use round-trip without adding signal —
      # superseded notes have already been integrated into the
      # latest contract. The 5 floor is generous (typical feature
      # has 1-3 active contracts); features with more than 5
      # contract notes are flagging that the seam-design phase
      # itself fragmented + would benefit from M3.5-style
      # consolidation.
      - from: any
        kinds: [contract_note]
        tail: 5
      # Conventions charter (the "Project Conventions" ADR authored at
      # M4). The Tweedles BUILD the code, so they're where cross-feature
      # divergence is born — each feature inventing its own publish-flag
      # name / 401 handling / route scheme. M4's charter only stops that
      # if it reaches the authoring agents; M8 already seeds adr, M7
      # didn't. Seeding it here lets the Tweedles build to the declared
      # conventions + consume the shared primitives the charter mandates.
      - from: any
        kinds: [adr]
      - from: tea-party
        kinds: [test_scenario]
      # Context-compression Lever C — tail: 1 keeps the MOST RECENT
      # review and drops older ones. On retry iterations after
      # `request-changes`, only the most recent review's findings
      # are actionable; older reviews of the same feature have been
      # superseded by Caterpillar's subsequent passes. Without this
      # bound, a feature that goes through 4 review cycles seeds 4
      # reviews into every M7 round-trip, compounding context-replay
      # cost while only the latest finding is load-bearing.
      - from: any
        kinds: [review]
        tail: 1
      # P21 (c) — the milestone's structural diagrams (Ophanic .oph),
      # milestone-scoped by the loader. The Tweedles build their component
      # against this contract and wire it into its parent (the hollow-build
      # fix — components built but never mounted into the app). Not
      # ticket-sliced: the whole milestone map is cheap context, and the
      # Tweedle locates their own component in it (the directive teaches
      # the ticket-title → ◆Node correspondence).
      - from: any
        kinds: [diagram]

    # Same exit_condition shape as M6: implementation lands → meeting
    # exits regardless of phase. max_rotations tightened from 4→2 on
    # implement and 2→1 on validate; with Hatter dropped from M7
    # (commit 428775e) and the early exit, the Tweedles converge
    # faster and don't need 4 rotations of pair-protocol back-and-
    # forth. If a ticket genuinely needs more iteration, the budget
    # cap is the failsafe.
    phases:
      - name: implement
        max_rotations: 2
        team_groupings: [[tweedledee, tweedledum]]
        exit_condition_artifact: implementation
        # T-ab25a: implement is a pure-execution phase — tweedles
        # need the ticket + contracts + current-meeting rotations,
        # not the accumulated chatter from N prior iteration
        # attempts. meeting_only drops the seed utterances
        # (re-published prior-thread history) that grow linearly
        # with re-runs on the same ticket. mvp-demo-rerun-A had
        # 2165 seeds vs 4 non-seeds → 203K-token overflow → crash.
        memory_scope: meeting_only
      - name: validate
        max_rotations: 1
        team_groupings: [[tweedledee, tweedledum]]
        exit_condition_artifact: implementation
        memory_scope: meeting_only

  # ─────────────────────────────────────────────────────────────────
  # M8 — Review per feature. Caterpillar evaluates the cohesive
  # feature deliverable. transition_iteration_to fires per feature
  # (not per ticket) — feature moves in_progress → ready_for_review
  # on M8 success.
  # ─────────────────────────────────────────────────────────────────
  - id: review
    label: M8
    name: The Trial
    goal: |
      review the feature's full deliverable — implementation,
      tests, and cross-ticket coherence — produce a verdict
    # T-ab54: Caterpillar-only. obol-260522-1 M8 cost analysis
    # (paper/artifacts/caterpillar-m8-cost-analysis.md) found
    # tweedles were the dominant M8 cost driver — $15.60 vs
    # Caterpillar's $7.13, a 2.2× ratio. They passed 80% of their
    # priority windows but paid full compose_context + tool-loop
    # cost per window. The YAML comment below previously noted the
    # design intent (tweedles "buzz in without a standing roster
    # slot" via §III selectively-engaging rules), but the roster
    # had drifted from that intent. Restoring it: Caterpillar
    # reviews, tweedles' M7 outputs (implementation summaries,
    # contract notes) are already seeded into M8 via the existing
    # bindings below, so Caterpillar's review context is unchanged.
    # If tweedles spot a misreading in Caterpillar's review they
    # can publish a concern to the bus from outside the meeting
    # (§III opt-in path), which lands as cross-meeting input
    # rather than guaranteed-window participation.
    roster: [caterpillar]
    per_item: feature
    iterate_only_in_states: [queued]
    # Bumped \$0.40 → \$0.60 based on real-run data: M8 consistently
    # ships verdicts at \$0.40-\$0.50 actual spend post-exit_condition
    # fix (commit 00e1b58). The \$0.40 budget was calibrated against
    # tdd-serial-phased's review timing where Caterpillar reviewed
    # smaller artifact sets; the per-feature shape with full
    # cross-ticket coherence checks needs more headroom.
    meeting_budget: 0.60
    convenor_directive: |
      **Caterpillar — review this feature.**

      **You MUST emit a review artifact in this meeting.** Silence is
      not a valid decision here — the downstream lifecycle
      transitions (ticket IN_PROGRESS → DONE, feature → ready_for_
      review) depend on a verdict artifact existing. Don't pass
      without shipping one. The valid verdicts are:

        - ``verdict: accept`` — code matches contracts, tests cover
          the acceptance criteria, cross-ticket coherence holds. Ship
          this when you have no load-bearing concerns. ``approvals``
          field must list at least one substantive thing that was
          well done (per Caterpillar §I — approval is not given
          cheaply, but "code matches contract A; tests cover
          acceptance criteria B; cross-ticket coherence verified
          across files X, Y" is sufficient when no concerns exist).
        - ``verdict: request-changes`` — at least one finding that
          needs author response before the feature can ship.
        - ``verdict: block`` — at least one finding severe enough
          that the work should not proceed in current form
          (architectural drift, security issue, contract violation).

      **If you genuinely have nothing to flag, ship
      ``verdict: accept`` with a brief approvals note.** The
      substrate has a safety net (T-ab59) that auto-synthesizes an
      accept review if you silence, but that's a substrate
      patch-over, not a substitute for your judgment. The audit
      trail is cleaner when YOU ship the verdict.

      **SCOPE DISCIPLINE — read this first.** Your review is scoped
      to THIS FEATURE ONLY. The project may contain other features
      (in this milestone or future milestones) at various states of
      completion; many will be incomplete or not started. **Do NOT
      surface findings about files / components / endpoints that
      belong to other features.** Those have their own review
      passes scheduled. A frontend ``NoteEditor`` component that
      doesn't exist yet is M2's problem, not M1's — flagging its
      absence during M1's review wastes budget and spawns
      misattributed follow-up tickets.

      **Scope the cross-ticket coherence check to this feature's
      stack_span:**

        - ``stack_span: backend`` — coherence check is contract
          notes + backend files only. Do NOT look at frontend
          files; they belong to capability milestones that
          haven't shipped yet (and shouldn't). The "consumer
          file" / "app entry point" guidance below ONLY applies
          to full-stack features.
        - ``stack_span: frontend`` — coherence check is contract
          notes + frontend files only. Do NOT look at backend
          source unless it's already shipped and this feature
          consumes it; if backend doesn't exist yet, that's a
          separate foundation milestone's job.
        - ``stack_span: full-stack`` — both sides, plus the app
          entry point. The cross-ticket check below in full
          applies here.

      The most expensive defects in feature work live *between* files:
      a contract note says one thing, the backend implements 50% of
      it, the frontend assumes 100% of it; or a component gets built
      but never wired into the app entry point. Per-file reviews
      can't catch these — they require reading multiple files
      together. Per analysis 040, this is the M8 failure mode that
      reproduces, and it's the one to ship FIRST when budget is
      tight. Do these checks in order:

        0. **Run ``verify_wiring`` first (P21).** It reverse-adapts the
           built front-end and diffs it against this milestone's structural
           diagrams, reporting every node as ``wired`` / ``orphaned`` /
           ``missing``. An ``orphaned`` node IS the built-but-never-mounted
           bug above, found deterministically — a component file that
           exists but nothing imports or renders (it passes its own unit
           test and ships nothing the user sees). A ``missing`` node is
           intended structure never built. Flag EVERY orphaned/missing node
           as a request-changes finding — the Tweedles wire it in or build
           it. The tool can't see SEMANTIC drift (a wired component showing
           the wrong field), so it doesn't replace the cross-ticket reading
           below — it makes the structural half cheap and certain so your
           reading budget goes to the semantic half the tool can't reach.

        1. **Cross-ticket coherence FIRST** (full-stack features
           only; for backend/frontend-only features, restrict to
           the relevant side). Open these together BEFORE any
           single-file review:
             - The feature's contract note(s) (the agreement
               between Tweedles on field semantics)
             - At least one backend file the contract names
               (skip if stack_span is frontend-only)
             - At least one frontend / consumer file the contract
               names (skip if stack_span is backend-only)
             - The app entry point (e.g. ``App.tsx``, ``main.py``,
               ``main.rs`` — wherever the feature gets mounted
               into the running program) — only for full-stack
               features that actually mount into the runtime
           Verify: do all three name the same fields with the same
           semantics? Does a category at 85%-of-budget produce the
           same display state in the frontend as in the backend's
           response shape? Does the app entry point actually import
           and render the component the work produced, or is it
           still rendering the skeleton's placeholder UI?
           Contract drift and orphaned components are the canonical
           cross-ticket bugs; both are invisible to a single-file
           review.

           **For a backend-only feature**, the coherence check is
           contract notes + backend files only. If you find
           yourself reading frontend code to verify coherence,
           STOP — you've drifted out of this feature's scope.
           Whole-project coherence is a separate workflow
           (milestone-review / end-of-milestone coherence pass);
           it's not your job in this M8.

        2. **Does the code match the contract + conventions?**
           Per-file: walk the implementation against the ADR +
           contract notes. Implementation that drifts from those
           commitments is a concern even if tests pass — surface the
           gap. **Check the "Project Conventions" ADR explicitly:**
           does this feature's field naming, route scheme, 401 /
           error handling, and publishable shape MATCH the charter,
           or did it invent its own — a `published` flag where the
           charter says `is_published`, a `/wrestlers/published`
           route where the charter says `/public/wrestlers`, a page
           that swallows a 401 where the charter says redirect? Did
           it hand-roll something the charter mandates as a SHARED
           PRIMITIVE (its own fetch + 401 logic instead of the
           declared API client)? Convention deviations ARE findings:
           an adjacent feature already set the precedent, and
           divergence is paid for later as a cross-feature refactor.
           This is a cheap, certain check — the charter names the
           rule, you match the diff against it — unlike the semantic
           cross-ticket reading in #1.

        3. **Do the tests cover the acceptance criteria?** Each
           ticket has acceptance conditions; are there test
           scenarios that demonstrate them? Missing coverage is a
           concern.

      **Before filing a verdict — oscillation check.** Look at your
      memory of this thread. If you've previously reviewed the SAME
      artifact (same file, same contract field, same behavior) and
      requested changes in OPPOSITE directions across cycles (e.g.,
      "add tags to seed data" in cycle 1, then "remove tags from
      seed data" in cycle 2, then a current Tweedle implementation
      flips it again) — that's not a bug to file another verdict
      against. It's a **contract ambiguity** the Tweedles cannot
      resolve from the spec alone, and another request-changes will
      just send them back to the previous interpretation.

      When you spot this pattern:

        1. STOP. Do not emit ``approve`` or ``request-changes`` on
           the oscillating artifact.
        2. Emit a ``question_to_operator`` speech act naming the
           specific ambiguity: *which* artifact, *which* field /
           behavior, and the two (or more) interpretations you've
           seen the Tweedles attempt. Phrase the question as a
           binary or short-list of options the operator can pick.
        3. Wait for the operator's OBSERVATION reply. The reply
           IS the ruling; treat it as authoritative for this
           feature's contract.
        4. In your NEXT review pass, if the contract note doesn't
           yet encode the operator's resolution, file a
           ``change-required`` finding requesting the Tweedles
           update the relevant contract note to make the
           resolution durable. (Without that artifact update,
           future implementations re-discover the ambiguity.)

      The signal you're looking for is opposite-direction
      requested-changes verdicts (not just any prior contact with
      the artifact — a single prior verdict isn't oscillation).
      Cycle counts on the affected tickets are a hint: see ``...
      (cycle 3)`` or higher in your seed context = high probability
      the team's been here before.

      Verdict: ``approve`` (ship it, transition to
      ready_for_review) or ``request-changes`` (block, name what
      must change). Be specific: quote line numbers, name fields,
      cite contracts. If budget runs out partway through, the
      cross-ticket check (#1) is the one that has to ship — it's
      the only review that catches contract drift between Tweedles.

      **Per-finding ``kind`` field — default ``bug``, but distinguish
      bugs from meta-feedback.** This is the substrate primitive
      that closes the recursive test-quality cycle analysis 033 §5.1
      documented. Mark a finding's ``kind`` honestly:

        - ``bug`` (default) — implementation defect. Behavior is
          wrong. The Tweedles need to fix the code. Substrate
          spawns a follow-up M6+M7+M8 cycle to address it.
          Examples: schema drift, contract mismatch, missing null
          check, tz bug, off-by-one, missing migration, XSS gap,
          OperationalError-class, wrong field on response.
        - ``meta`` — feedback about how the code expresses its
          intent. Behavior is CORRECT but expression could be
          better. Recorded in the review artifact for the author;
          does NOT spawn an implementation ticket regardless of
          severity. Examples: *"test assertions lack failure
          messages,"* *"this function name implies idempotence
          but the body has side effects,"* *"this test allows
          multiple conflicting interpretations,"* *"naming
          inconsistent across the module."*
        - ``convention`` — codebase style / convention.
          Advisory, no ticket. Examples: naming-case drift,
          response-envelope-shape inconsistency.
        - ``nit`` — minor cosmetic. Advisory, no ticket. Use
          sparingly; nit-storm is bikeshedding.

      The distinction is **orthogonal to severity**. A
      ``change-required``-severity ``meta``-kind finding tells the
      author *"this matters, address it in your next touch"* +
      tells the substrate *"do NOT respawn the M6+M7+M8 cycle to
      re-implement the test."* In mvp-demo2, ~30% of M7 cost
      went to a recursive test-quality cycle that should have been
      ``meta`` from the start. Mark honestly; don't inflate
      meta-feedback to bug just to ensure attention — that's
      the cycle the substrate primitive is built to break.

      In a typical 5-finding review: most are ``bug``, 1-2 might
      be ``meta`` if the implementation works but the test or
      code's expression has clarity issues.

      **Per-finding ``test_coverage_required`` flag — default
      FALSE, and false is right for almost every finding you file.**

      You usually don't set this flag at all. Leave it omitted (or
      explicitly ``false``); the synthesized follow-up ticket
      skips tea-party. The finding's location + quote + concern +
      request IS the spec — Mad Hatter's adversarial scenario
      design adds ~$0.50/ticket of overhead for findings whose fix
      is already fully specified.

      Set ``true`` only when the fix introduces a **brand-new
      capability surface** that the team has never written a test
      against, where edge-case enumeration genuinely needs a
      tea-party — think feature-scale additions slipped through
      review, not corrections to existing surfaces:

        - ✅ true: "add JWT validation," "implement conflict
          resolution UX," "introduce retry-with-backoff,"
          "add multi-tenant request scoping"
        - ❌ false (these are correction findings, not new
          capabilities): schema drift, contract mismatch between
          frontend/backend, wrong field name, missing null check,
          tz-aware/naive datetime bug, off-by-one in pagination,
          missing error-state handling, unhandled empty case,
          forgotten input sanitization, typo, missing migration,
          OperationalError-class bugs

      Heuristic: if a Tweedle reading the finding could write a
      test for the fix in one sitting without needing Mad Hatter's
      adversarial discipline, it's false. If the fix is a new
      feature surface that didn't exist before this review, it's
      true. **In a typical review pass, 0–1 findings out of 5
      should carry ``true``.** When in doubt, leave it false.

      **Tweedles — defend or revise.** If Caterpillar requests
      changes, the responsible Tweedle either revises in this
      meeting (small scope) or surfaces the change as a follow-up
      ticket (larger scope). Don't argue against valid concerns;
      the team's collective standard for ``ready_for_review`` is
      what M8 enforces.

    seeds:
      # project_context names the entry_point (load-bearing for the
      # App.tsx-orphan check from analysis 040) + the runtime
      # shape (Caterpillar uses this to skip stack-incompatible
      # checks: don't expect App.tsx wiring on a TUI project, etc.)
      - from: any
        kinds: [project_context]
      # Cross-workflow material (features, tickets, ADRs, contracts)
      # comes from disk via seed-fallback. tea-party + implementation
      # output lives on this run's bus.
      # Same iteration-kind-slice fix: M8's per_item is feature, so
      # the feature binding gets sliced to the current feature; the
      # rest pass through unfiltered. Without the split, contract_note
      # / adr / ruling / ticket utterances (no feature artifacts
      # attached) all get dropped before reaching Caterpillar's
      # cross-ticket coherence review.
      - from: any
        kinds: [feature]
      - from: any
        kinds: [ticket, adr, ruling, contract_note]
      - from: tea-party
        kinds: [test_scenario]
      - from: implementation
        kinds: [implementation]
      # T-ab39: re-seed prior review records so T-ab29's oscillation
      # detection still has signal under memory_scope: meeting_only
      # below. Without this re-seed, the cross-meeting memory drop
      # would blind Caterpillar to prior cycles' verdicts and
      # request-changes / approve flip-flop becomes invisible. tail: 2
      # keeps the most-recent two cycles' verdicts (current cycle's
      # antecedents are what matter for the opposite-direction-verdict
      # check); older cycles are superseded and irrelevant.
      - from: any
        kinds: [review]
        tail: 2
      # P21 (d) — the milestone's structural diagrams. Caterpillar runs
      # verify_wiring (which reads them from disk) but also sees them here
      # to interpret the findings + check nesting (is WeatherCard rendered
      # where the diagram says it nests?). Milestone-scoped by the loader.
      - from: any
        kinds: [diagram]

    # No ``transition_iteration_to`` line on M8 anymore. The
    # substrate routes verdicts directly to the ticket lifecycle:
    #   - accept → tickets IN_PROGRESS → DONE
    #   - request-changes / block → original tickets IN_PROGRESS → DONE,
    #     AND the review's findings are synthesized into NEW follow-up
    #     tickets transitioned to QUEUED (see _find_blocking_reviews +
    #     the follow-up synthesis path). M8 does NOT abort tickets — the
    #     rework is captured as fresh queued work, nothing is stranded.
    #     (ABORTED is reserved for design-time culls: dedup consolidation
    #     + scope-leak retraction, plus operator-manual kill.)
    # Feature state then derives from the ticket rollup, so
    # all-tickets-DONE rolls up to ``ready_for_review`` without
    # needing an explicit feature transition here. (Previous
    # ``transition_iteration_to: ready_for_review`` line became
    # dead code under derived-feature-state.)
    #
    # Single-phase: review exits as soon as Caterpillar ships her
    # verdict. Pre-this-fix the meeting had a separate "defend"
    # phase running 1 rotation post-exit, which on every recent run
    # tipped total spend over the meeting_budget cap and stranded
    # the lifecycle ready_for_review transition (M8 outcome wasn't
    # COMPLETE because defend hit MEETING_BUDGET). Tweedle defense,
    # if relevant, shows up as concerns during the review phase
    # before Caterpillar's verdict lands — the §III selectively-
    # engaging rules let Tweedles buzz in without a standing
    # roster slot.
    phases:
      - name: review
        max_rotations: 2
        # T-ab54: team_groupings removed alongside the roster narrow.
        # With cast=[caterpillar] the default one-agent-per-team
        # behavior is correct; an explicit single-member team would
        # be no-op noise.
        exit_condition_artifact: review
        # T-ab39: review is the single biggest cost line in implement
        # runs (observed $0.51-$1.75/feature on obol pilots). Caterpillar
        # at M8 reads the implementation off disk + receives contracts,
        # tickets, prior reviews via seeds — the accumulated chatter
        # from M5 contract negotiation + M6 tea-party + M7 implementation
        # is noise during review, not signal. meeting_only drops it.
        #
        # T-ab29 oscillation detection compensated for separately via
        # `kinds: [review] tail: 2` added to the meeting seeds above:
        # prior cycle verdicts come through as seed context instead of
        # via full thread_history memory query. Cheaper signal path.
        memory_scope: meeting_only

  # ─────────────────────────────────────────────────────────────────
  # M9 — Verify. Substrate-only check; no agents convene. Fires
  # ``pytest --collect-only`` against the project to catch
  # structural bugs that pass Caterpillar's M8 review (import-time
  # FastAPI errors, missing ``Depends(get_db)``, syntax slips that
  # didn't surface in code review).
  #
  # In the pipelined runner this fires once per feature lane —
  # right after that feature's M8 — so failures get attributed to
  # the feature whose tickets just shipped. On failure: synthesizes
  # a system review on disk + routes through the existing
  # _route_blocking_review path, which queues follow-up tickets
  # against the same feature. Feature stays out of
  # ready_for_review until those tickets are worked, so the next
  # implementation run picks them up.
  #
  # Skipped paths (no pyproject.toml, no pytest, no tests
  # collected) all emit informational events with outcome=COMPLETE
  # — projects that haven't set up tests yet shouldn't be punished
  # with auto-tickets they can't act on.
  # ─────────────────────────────────────────────────────────────────
  - id: verify
    label: M9
    name: Verify
    goal: |
      run the project's own test suite + frontend build to surface
      structural failures the per-feature review can't catch
    kind: verify
    # List of checks, run in declaration order. Skipped checks
    # degrade silently — frontend-less skeletons (python-cli,
    # python-tui, python-fastapi without React) skip ``npm_build``
    # without firing the substrate; backend-less skeletons (pure
    # vite SPA) skip ``pytest_collects``.
    build_check:
      # Three-tier verification, ordered cheapest → most expensive:
      # 1. pytest_collects: do the tests import? Catches structural
      #    bugs (missing imports, Pydantic shadow fields, malformed
      #    decorators) for ~30s of cost.
      # 2. pytest_passes: do the tests pass? Catches runtime bugs
      #    Caterpillar's static review can't surface — schema
      #    drift between SQLAlchemy model and live DB, datetime
      #    tz mismatches, contract drift between test expectations
      #    and implementation. Validation5 feature 2 surfaced
      #    three such bugs Caterpillar accepted as correct but
      #    failed pytest execution; this check closes the gap.
      # 3. npm_build: frontend TypeScript + Vite build. Catches
      #    the orphan-component shape from analysis 040 + any TS
      #    errors the per-file review missed.
      - pytest_collects
      - pytest_passes
      - npm_build

category: implementation
