name: canonical
description: |
  Faster/cheaper alternative to the tdd workflow (now the
  recommended default per analysis 024). Keep this around for
  exploratory work, throwaway prototypes, very concrete directives,
  and as the structural variant Dodo can pick when speed matters
  more than directive-alignment guarantee.

  The 5-meeting sequence for greenfield-on-skeleton features:
  scoping → decomposition → contract negotiation → implementation
  → review. Validated end-to-end across analyses 015-023 — produces
  a real feature MVP from a vague directive in ~8 minutes / ~$1.50,
  on top of an existing project skeleton (closet/skeletons/<name>).

  Risk to be aware of: without Hatter's failing tests pinning
  behavior, the team can ship coherent code that drifts from what
  was asked. Analysis 024 documents one such drift (canonical built
  baseline message endpoints when asked for rate limiting). The
  drift is rare for concrete directives, common for vague ones.

  Used as the baseline for the Dodo dynamic-workflow generation
  work (roadmap 29497820).

version: 1

defaults:
  budget_dollars: 3.00
  timeout_seconds: 900.0
  # Wall-clock fallback for hung LLM calls. Turn-based quiescence
  # fires the moment all members go IDLE — this is just the safety
  # net for the pathological case (network-hung deliberate, agent
  # crashed mid-state-transition).
  quiescence_seconds: 300.0

meetings:
  # ---------------------------------------------------------------------
  - id: scoping
    label: M1
    goal: produce user stories + an architectural ADR + GDPR rulings
    roster: [alice, cheshire_cat, queen_of_hearts]
    meeting_budget: 0.40
    # convenor_directive omitted: this is the entry meeting, the
    # runtime passes the user's directive through verbatim. Alice
    # produces stories from it, Cat ships an ADR off the stories,
    # Queen surfaces compliance/security concerns.
    seeds: []

  # ---------------------------------------------------------------------
  - id: decomposition
    label: M2
    goal: decompose the ADR + stories into v1 tickets
    roster: [white_rabbit, cheshire_cat]
    meeting_budget: 0.30
    convenor_directive: |
      Decomposition thread. The stories and ADR(s) in your context
      are settled — they were produced in a prior scoping thread.
      Read them as locked context, not as fresh proposals to respond
      to. Rabbit, your move is `ticket`: decompose the user-story-
      and-architecture picture into v1-scope work units the Tweedles
      can pick up. Cat, weigh in only if a ticket implies a fresh
      architectural decision the existing ADRs don't cover.
    seeds:
      - from: scoping
        kinds: [adr, story]

  # ---------------------------------------------------------------------
  - id: contract-negotiation
    label: M3
    goal: negotiate contracts the Tweedles will implement against
    roster: [tweedledee, tweedledum]
    meeting_budget: 0.80
    convenor_directive: |
      Contract negotiation thread. The ADR(s) and ticket in your
      context are settled — read them as locked. Tweedledee,
      Tweedledum: this is the pair's design work. **Do NOT call
      write_file in this thread.** The codebase is not yet in scope —
      you are designing the seam, not shipping. Implementation
      happens in the next thread.

      Draft the contract notes that nail down the seam between
      frontend and backend for the seeded ticket. Half-formed is
      fine (state=proposed); your sibling fills in their side. Reach
      `state=agreed` on the load-bearing contracts before this
      meeting closes.
    seeds:
      - from: scoping
        kinds: [adr]
      - from: decomposition
        kinds: [ticket]
        limit: 1   # first ticket only; one is enough to start the negotiation

  # ---------------------------------------------------------------------
  - id: implementation
    label: M4
    goal: ship code honoring the agreed contracts
    roster: [tweedledee, tweedledum]
    meeting_budget: 1.00
    convenor_directive: |
      Implementation thread. The contract notes in your context
      are locked. Your move is `implementation`. **Call `write_file`
      to actually ship code** — the working tree is the artifact, the
      bus utterance is the team's record of what happened.

      **The codebase ALREADY EXISTS in the working tree** — the
      project skeleton is laid down before the run.

      **MANDATORY first move: call `list_files` on the project root
      before any `write_file`.** The skeleton's directory layout is
      authoritative — do NOT invent new top-level directories. If
      the skeleton has `frontend/src/`, frontend code goes there;
      do not create `src/frontend/`. If it has `src/backend/`, backend
      code goes there; do not create `backend/`. New files extend
      the existing tree, never replace it.

      After `list_files`, use `read_file` on the key files in your
      domain (frontend → `frontend/src/App.tsx`, `frontend/src/api.ts`;
      backend → `src/backend/models.py`, `src/backend/api/`) to
      understand the conventions before writing.

      Tweedledee owns frontend; Tweedledum owns backend.
    seeds:
      - from: scoping
        kinds: [adr]
      - from: contract-negotiation
        kinds: [contract_note]
        where:
          state: agreed
        fallback: any   # if no agreed contracts, send all proposed ones

  # ---------------------------------------------------------------------
  - id: review
    label: M5
    goal: Caterpillar reviews the shipped code; surface findings
    roster: [caterpillar, tweedledee, tweedledum]
    meeting_budget: 0.50
    convenor_directive: |
      Review thread. Code was shipped in a prior implementation
      thread. Caterpillar: the working tree IS the implementation
      artifact — call `git_status` to see what shipped, then
      `git_diff` to read the changes. Surface findings on the code
      itself, citing files and lines. Tweedles: respond to findings;
      if a finding implies a code change you agree with, ship the
      fix via `write_file` and re-emit an `implementation` utterance.
      Do not re-litigate the contracts; they're locked.
    seeds:
      - from: implementation
        kinds: [implementation]
