name: tdd
description: |
  Test-first variant of the canonical workflow. Hatter writes
  failing test scenarios + the actual test files BEFORE Tweedles
  ship implementation. Tweedles then implement to make Hatter's
  tests pass.

  Differs from canonical:
    - 6 meetings instead of 5 — Hatter's test-writing phase (M4)
      is inserted between contract negotiation (M3) and
      implementation (M5)
    - M5 (implementation) directive points Tweedles at the failing
      tests as the closure criterion rather than just "ship code
      against the contracts"
    - M3 (contract-negotiation) is unchanged — Tweedles still
      negotiate the seam; Hatter's tests are written *against the
      agreed contracts*

  Tradeoffs:
    - More expensive (~+30% — extra meeting, Hatter's calls, plus
      Tweedles spending more time understanding failing tests)
    - Stronger guarantees: implementation can't drift from intent
      because Hatter's tests pin behavior; Tweedles get a concrete
      red→green target instead of a paragraph of directive
    - Better for safety-critical or regression-prone surfaces; the
      canonical workflow is fine for most greenfield work where
      Hatter's role is review-after-the-fact (canonical M5)

  Use this for: features where regressions are expensive to find
  later (auth flows, payment paths, security-critical surfaces).

version: 1

defaults:
  budget_dollars: 4.00   # higher than canonical's $3 — extra meeting + Hatter cost
  timeout_seconds: 1200.0
  quiescence_seconds: 300.0

meetings:
  # ---------------------------------------------------------------------
  # M1-M3 are identical to canonical. The TDD variation kicks in at M4.
  # ---------------------------------------------------------------------
  - id: scoping
    label: M1
    goal: produce user stories + an architectural ADR + GDPR rulings
    roster: [alice, cheshire_cat, queen_of_hearts]
    meeting_budget: 0.40
    seeds: []

  - id: decomposition
    label: M2
    goal: decompose the ADR + stories into v1 tickets
    roster: [white_rabbit, cheshire_cat]
    meeting_budget: 0.30
    convenor_directive: |
      Decomposition thread. The stories and ADR(s) in your context
      are settled — they were produced in a prior scoping thread.
      Read them as locked context, not as fresh proposals to respond
      to. Rabbit, your move is `ticket`: decompose the user-story-
      and-architecture picture into v1-scope work units the Tweedles
      can pick up. Cat, weigh in only if a ticket implies a fresh
      architectural decision the existing ADRs don't cover.
    seeds:
      - from: scoping
        kinds: [adr, story]

  - id: contract-negotiation
    label: M3
    goal: negotiate contracts the Tweedles will implement against
    roster: [tweedledee, tweedledum]
    meeting_budget: 0.80
    convenor_directive: |
      Contract negotiation thread. The ADR(s) and ticket in your
      context are settled — read them as locked. Tweedledee,
      Tweedledum: this is the pair's design work. **Do NOT call
      write_file in this thread.** The codebase is not yet in scope
      — you are designing the seam, not shipping. Hatter writes
      failing tests against your contracts in the next thread, then
      implementation happens.

      Draft the contract notes that nail down the seam between
      frontend and backend for the seeded ticket. Half-formed is
      fine (state=proposed); your sibling fills in their side. Reach
      `state=agreed` on the load-bearing contracts before this
      meeting closes — Hatter writes tests against agreed contracts
      only.
    seeds:
      - from: scoping
        kinds: [adr]
      - from: decomposition
        kinds: [ticket]
        limit: 1

  # ---------------------------------------------------------------------
  # M4 is the TDD-specific phase. Hatter writes failing tests + the
  # actual test files; Tweedles ask clarifying questions but don't
  # write production code (that's M5).
  # ---------------------------------------------------------------------
  - id: test-scenarios
    label: M4
    goal: produce failing test scenarios + test files against the agreed contracts
    roster: [mad_hatter, tweedledee, tweedledum]
    meeting_budget: 0.80
    convenor_directive: |
      Test-scenarios thread. The contract notes in your context are
      locked (state=agreed in the prior thread). Hatter, this is
      your move: ship `test_scenario` artifacts that nail down the
      contracts in runnable form, AND `write_file` the actual test
      files against the existing project skeleton's test framework.
      Edge cases first — that's where the system actually lives. Use
      property-based shapes when the contract permits.

      The tests should FAIL right now (no production code exists for
      the new contracts). That's the point — they're the red in
      red→green→refactor. Tweedles will turn them green in the next
      thread.

      Tweedledee, Tweedledum: ask Hatter clarifying questions if a
      test's intent is ambiguous against your contract — you are
      about to implement against these. Do NOT write production
      code in this thread; the codebase you'd extend is the test
      files, not the implementation surface.

      Tweedles: read the existing tests/conftest.py to understand
      the testing conventions before responding to Hatter's
      scenarios. The tests Hatter ships should plug into the same
      framework.
    seeds:
      - from: scoping
        kinds: [adr]
      - from: contract-negotiation
        kinds: [contract_note]
        where:
          state: agreed
        fallback: any

  # ---------------------------------------------------------------------
  # M5 is implementation, but the closure criterion is "Hatter's tests
  # pass" — different from canonical M4's "code shipped against
  # contracts". Tweedles iterate until red→green.
  # ---------------------------------------------------------------------
  - id: implementation
    label: M5
    goal: implement to make Hatter's failing tests pass (red → green)
    roster: [tweedledee, tweedledum]
    meeting_budget: 1.20
    convenor_directive: |
      Implementation thread. Hatter shipped failing tests in the
      prior thread — read them via `read_file` (look in tests/) so
      you know the closure criterion. Your move is `implementation`.
      **Call `write_file` to ship production code** that turns
      Hatter's red tests green.

      The cycle is red → green → refactor. You're in the green step.
      Don't refactor Hatter's tests; if a test is wrong, raise a
      `concern` — but default assumption is the tests describe
      correct behavior.

      **The codebase ALREADY EXISTS in the working tree** — the
      project skeleton is laid down before the run. Call `list_files`
      to see the layout, `read_file` to read what's there,
      `write_file` to extend.

      Tweedledee owns frontend; Tweedledum owns backend. Run the
      tests if you have a way to (you can't actually execute
      pytest; rely on your read of the test code to validate
      coverage). Closure: every test_scenario from M4 has matching
      production code that would make it pass.
    seeds:
      - from: scoping
        kinds: [adr]
      - from: contract-negotiation
        kinds: [contract_note]
        where:
          state: agreed
        fallback: any
      - from: test-scenarios
        kinds: [test_scenario]

  # ---------------------------------------------------------------------
  # M6 is review — Caterpillar reviews the IMPLEMENTATION (not the
  # tests, those are Hatter's). Same shape as canonical's review
  # meeting.
  # ---------------------------------------------------------------------
  - id: review
    label: M6
    goal: Caterpillar reviews the shipped code; surface findings
    roster: [caterpillar, tweedledee, tweedledum]
    meeting_budget: 0.50
    convenor_directive: |
      Review thread. Code was shipped in a prior implementation
      thread to make Hatter's tests pass. Caterpillar: the working
      tree IS the implementation artifact — call `git_status` to see
      what shipped, then `git_diff` to read the changes. Surface
      findings on the production code itself, citing files and
      lines.

      You can also `read_file` Hatter's tests if a finding hinges on
      whether the code matches test intent — but don't critique
      Hatter's tests themselves; that's not in scope.

      Tweedles: respond to findings; if a finding implies a code
      change you agree with, ship the fix via `write_file` and
      re-emit an `implementation` utterance. Do not re-litigate the
      contracts or the tests; both are locked.
    seeds:
      - from: implementation
        kinds: [implementation]
