name: tdd
description: |
  Test-first variant of the canonical workflow. Alice and Hatter
  pair up (the tea party) to write failing tests + the actual test
  files BEFORE Tweedles ship implementation. Tweedles then implement
  to make those tests pass.

  Differs from canonical:
    - 6 meetings instead of 5 — Alice + Hatter's test-writing phase
      (M4) is inserted between contract negotiation (M3) and
      implementation (M5)
    - Alice ships user-journey scenarios (the WHO-IS-THIS-FOR
      surface — happy paths, observable user-facing behavior).
      Hatter ships failure-mode scenarios (security, concurrency,
      malformed input, the edges where the system actually lives).
      Together they form the test pyramid; neither alone is enough.
    - M5 (implementation) directive points Tweedles at both
      surfaces as the closure criterion rather than just "ship code
      against the contracts"
    - M3 (contract-negotiation) is unchanged — Tweedles still
      negotiate the seam; the test surface is written *against the
      agreed contracts*

  Tradeoffs:
    - More expensive (~+40% vs canonical — extra meeting, Alice +
      Hatter's calls, Tweedles spending more time understanding the
      failing tests)
    - Stronger guarantees: implementation can't drift from intent
      because the tests pin behavior on both axes; Tweedles get a
      concrete red→green target rather than a paragraph of directive
    - Better for any feature work where regressions matter; the
      canonical workflow is fine for throwaway prototypes and
      exploratory work where directive drift is unlikely

  Use this for: features where regressions are expensive to find
  later (auth flows, payment paths, security-critical surfaces).

version: 1

defaults:
  budget_dollars: 6.00   # extra meeting + Alice + Hatter pair + M4 headroom + M6 review-and-fix loop
  # No timeout_seconds — Wonderland is turn-based; wall-clock global
  # timeout was a category error that caused real bugs (see analysis
  # 029's M5-RUNNING-outcome cascade). Runaway-loop protection is
  # GLOBAL_BUDGET's job. The ThreadMonitor's wall-clock quiescence
  # check (quiescence_seconds) remains as the safety net for hung
  # deliberations.
  quiescence_seconds: 300.0

meetings:
  # ---------------------------------------------------------------------
  # M1-M3 are identical to canonical. The TDD variation kicks in at M4.
  # ---------------------------------------------------------------------
  - id: scoping
    label: M1
    name: The Caucus Race
    goal: produce user stories + an architectural ADR + GDPR rulings
    roster: [alice, cheshire_cat, queen_of_hearts]
    meeting_budget: 0.40
    seeds: []

  - id: decomposition
    label: M2
    name: The Rabbit's Errand
    goal: decompose the ADR + stories into v1 tickets, with the user-facing point preserved
    roster: [alice, white_rabbit, cheshire_cat]
    meeting_budget: 0.40
    convenor_directive: |
      Decomposition thread. The stories and ADR(s) in your context
      are settled — they were produced in a prior scoping thread.
      Read them as locked context, not as fresh proposals to respond
      to.

      **Rabbit, your move is `ticket`:** decompose the user-story-
      and-architecture picture into v1-scope work units the Tweedles
      can pick up.

      **Cat:** weigh in only if a ticket implies a fresh architectural
      decision the existing ADRs don't cover.

      **Alice — you're here as the grounding voice.** You wrote the
      stories Rabbit is decomposing; your job in this thread is to
      defend them when Rabbit's tickets compress them past user-
      recognition, and to ask "would the persona I named actually
      care about this?" when a ticket drifts toward technical
      convenience. You are not driving the decomposition; you are
      defending the user-facing point of it. Default to silence
      unless the work is drifting from a story your persona would
      recognize.
    seeds:
      - from: scoping
        kinds: [adr, story]

  # ---------------------------------------------------------------------
  # M2.5 is the feature-composition phase — tickets get grouped into
  # user-facing features that span the stack coherently. Addresses the
  # gap surfaced in analysis 026/027: M3 currently seeds from a single
  # ticket and Tweedles generalize from there, which produces the
  # inconsistent-frontend-vs-backend pattern across runs. With features,
  # M3 negotiates seams against a coherent user-facing unit instead of
  # inferring cross-stack coordination from a representative ticket.
  # ---------------------------------------------------------------------
  - id: composition
    label: M2.5
    name: Advice from a Caterpillar
    goal: group v1 tickets into user-facing features that span the stack coherently
    roster: [alice, white_rabbit, caterpillar]
    meeting_budget: 0.40
    convenor_directive: |
      **Rabbit, ship features.** This is your meeting — the chapter
      title (Caterpillar's chapter) describes the *stance* the team
      takes in this thread, not who's driving. You are. Read the
      tickets in your context and group them into user-facing
      features. A feature is a capability a user can describe in
      one sentence; it aggregates multiple tickets that ship
      together as a coherent thing. **Silence is wrong here — your
      job is to produce features.** The decomposition work already
      happened in the prior thread (the Rabbit's Errand); this
      thread is the composition work that hands off to the
      Tweedles. Without features, M3 has nothing to negotiate
      against and the rest of the pipeline degrades.

      For every feature you ship, name:
      - `stack_span` — frontend / backend / full-stack. Tweedles
        use this in M3 to decide whether both sides need to align
        on the seam or just one.
      - `personas` — at least one persona name from the M1 stories
        that this feature serves. If you can't name a persona, the
        grouping isn't a feature, it's a bag of tickets.
      - `tickets` — the ticket slugs this feature aggregates.
      - `tier` — v1 / fast-follow / post-launch. Tier the feature
        separately from its constituent tickets. A feature can be
        deferred to fast-follow even when its underlying tickets
        stay v1 (the ticket is the unit of work; the feature is
        the unit of user-facing framing).

      You don't need to be perfect — half-formed groupings are
      better than silence. Alice and Caterpillar will push back
      if you've drifted; revise from there.

      **Alice — same grounding role as M2.** Audit feature claims
      against your stories. Push back when a feature has drifted
      from a story your persona would recognize, or when a story
      you wrote has no feature serving it (dropped on the floor in
      the grouping). Default to silence unless a grounding
      intervention is needed.

      **Caterpillar — apply your "who are you?" stance one layer
      earlier than M6.** For each feature Rabbit ships, ask: what
      does this claim, and do its constituent tickets actually
      deliver that? You're reviewing the *promise* the feature
      makes, not shipped code. Speak when a feature's claim is
      incoherent with its tickets, or when its tickets aggregate
      something that isn't a coherent capability the user would
      name. Default to silence otherwise.

      Don't add tickets, don't remove tickets, don't re-litigate
      scope. Group what's there.
    seeds:
      - from: scoping
        kinds: [adr, story]
      - from: decomposition
        kinds: [ticket]

  - id: contract-negotiation
    label: M3
    name: Tweedledum and Tweedledee
    goal: negotiate contracts the Tweedles will implement against
    roster: [tweedledee, tweedledum]
    meeting_budget: 0.80
    convenor_directive: |
      Contract negotiation thread. The ADR(s) and features in your
      context are settled — read them as locked. Tweedledee,
      Tweedledum: this is the pair's design work. **Do NOT call
      write_file in this thread.** The codebase is not yet in scope
      — you are designing the seam, not shipping. Hatter writes
      failing tests against your contracts in the next thread, then
      implementation happens.

      Each feature in your context names a `stack_span`:
      - `full-stack` features: both of you negotiate the seam
        together. The contract spans frontend ↔ backend — surface
        what each side promises and consumes.
      - `frontend` features: Tweedledee leads; Tweedledum confirms
        no backend impact (or names the impact if there is one).
      - `backend` features: Tweedledum leads; Tweedledee confirms
        no frontend impact.

      Draft the contract notes that nail down the seams. Half-formed
      is fine (state=proposed); your sibling fills in their side.
      Reach `state=agreed` on the load-bearing contracts before this
      meeting closes — Hatter writes tests against agreed contracts
      only.
    seeds:
      - from: scoping
        kinds: [adr]
      - from: composition
        kinds: [feature]

  # ---------------------------------------------------------------------
  # M4 is the TDD-specific phase. Hatter writes failing tests + the
  # actual test files; Tweedles ask clarifying questions but don't
  # write production code (that's M5).
  # ---------------------------------------------------------------------
  - id: test-scenarios
    label: M4
    name: The Mad Tea Party
    goal: produce failing test scenarios + test files (user journeys + failure modes) against the agreed contracts
    roster: [alice, mad_hatter, tweedledee, tweedledum]
    meeting_budget: 1.50
    convenor_directive: |
      Test-scenarios thread — the tea party. The contract notes in
      your context are locked (state=agreed in the prior thread).
      Alice and Hatter, this is the pair's work: between you, you
      pin the test surface that M5's implementation has to satisfy.
      Tweedles ask clarifying questions; do NOT write production
      code in this thread.

      **Scope tests per feature, not per system.** Your context
      includes the features Rabbit shipped in M2.5 and the contracts
      the Tweedles agreed in M3. For each feature, you ship test
      scenarios bounded by that feature's claim and stack_span —
      not generalized to invariants that span the whole system.
      Stop when a feature is covered; don't keep generating tests
      because more failure modes are imaginable. Caterpillar's
      review in M6 is the system-wide-invariants safety net — you
      don't need to be exhaustive at this layer. Bounded reasoning
      is the right shape for this meeting; sprawling reasoning is
      the failure mode.

      **Alice's move** — user-journey scenarios, one per feature.
      For each feature, write the happy-path scenario: a real
      persona from your M1 stories, the sequence of actions they
      take to use the feature, the observable result. One scenario
      per feature is the floor; ship more only when a feature has
      genuinely distinct user paths. These are the WHO-IS-THIS-FOR
      tests — what does a real user do with this feature, and does
      it work?

      **Hatter's move** — failure-mode scenarios, scoped per
      feature. For each feature, ship the load-bearing edge cases
      that match its failure-mode profile (security, concurrency,
      malformed input, the things that look fine on the happy path
      and break on the second Tuesday in March). Match the feature's
      stack_span: full-stack features need both halves of the edge
      cases; one-sided features need only their side. Stop when the
      feature's surface is covered — system-wide invariants are
      M6's job.

      **CRITICAL: each of you must do TWO things per scenario, not
      one.** A scenario without a runnable test file is documentation,
      not a test. Implementation in M5 cannot turn a markdown artifact
      red→green; it can only turn a `.py` file red→green.

      For EVERY scenario you ship:

      1. Emit the `story` (Alice) or `test_scenario` (Hatter)
         artifact via the structured response (this lands in
         `.wonderland/stories/` or `.wonderland/test-scenarios/` as
         your team-record of *what* the test pins).

      2. **AND** call `write_file` on `tests/test_<descriptive>.py`
         (or `tests/test_<feature>_<axis>.py` to match the existing
         conftest convention) with the actual pytest code that
         encodes the scenario. Multiple scenarios can share a file
         when they're in the same domain. The test should FAIL right
         now (no production code exists yet); use `pytest.skip`,
         `pytest.xfail`, or just import-from-modules-that-don't-exist-
         yet — whichever expresses the red state most cleanly.

      Skipping step 2 is the most common failure mode of this
      meeting. If you finish your turn and `tests/` has no new files,
      you have not done your job.

      Read `tests/conftest.py` first (use `read_file`) to understand
      the existing pytest fixtures and conventions; the test files
      you write should plug into the same framework.

      Together you produce the test pyramid: Alice pins what real
      users do; Hatter pins what real users *eventually* do that
      breaks things. Neither alone is enough — Alice without Hatter
      misses the edges; Hatter without Alice misses the journeys.
      The Tweedles' implementation in M5 has to satisfy both
      surfaces. (This pairing is on-brand: the Mad Hatter's tea
      party in the source material is *Alice's* tea party — she's
      the visitor who shows up to find the cups laid out.)

      All tests should FAIL right now (no production code exists
      for the new contracts). That's the point — they're the red in
      red→green→refactor. M5 turns them green.

      **Tweedledee and Tweedledum — your M4 contribution is bounded
      and reactive, not proactive.** This thread is Alice and
      Hatter's pair work. Your role is to answer their questions if
      they ask, and — at most ONCE per feature in scope, only if
      needed — raise a `concern` about a contract gap that genuinely
      blocks M5's ability to make a feature's tests pass. Examples
      of genuinely-blocking gaps: a state transition the test
      exercises that no contract names; a payload field the test
      asserts on that the contract doesn't define; an error path
      the test describes that the contract is silent on.

      **Bound your concerns to ONE per feature in scope.** If you
      find a second potential gap, sit with it — most contract gaps
      surface cleanly in M5 when you actually start implementing,
      and M5 already has an explicit "raise as a concern, don't
      silently work around it" escape valve for exactly this.
      Surfacing every ambiguity preemptively in M4 expands the
      meeting without proportional benefit; M5 is the natural place
      to discover what the implementation actually needs.

      **Do NOT call `write_file` in this thread — at all.** No
      production code, AND no test files. Test authorship is Alice
      and Hatter's domain in this meeting; if you see a test surface
      gap, raise it as a concern (within your one-per-feature
      budget) and let them write it. M5 is your turf for shipping
      both implementation AND any complementary tests that
      implementation reveals are needed. This thread, you read and
      respond.

      **Hatter — stay in your lane.** Your job here is to ship
      failure-mode scenarios for features. Two things you do NOT do:

      1. **Don't iterate on meta-discussion.** If you observe
         process issues mid-meeting (workflow breaking, contract
         ambiguities, another agent shipping off-spec), raise ONE
         `concern` naming the problem clearly and move on. Do not
         re-litigate once raised. Caterpillar reviews shipped work
         in M6; the Dodo orchestrates the team.
      2. **Don't write production code.** No `write_file` calls
         into `src/backend/`, `frontend/src/`, or anywhere outside
         `tests/` (the test files you author) and `.wonderland/`
         (artifact paths, but those should go through speech-act
         emissions, not direct writes). Production code is M5's
         job and the Tweedles' lane. If you see a contract
         ambiguity that needs code-level resolution, raise a
         `concern` with the contract gap — don't fix it yourself
         by editing src/.

      Per analysis 029 F5 + the v7 follow-up: your §VIII failure
      mode (scenario sprawl + severity inflation) generalizes to
      both meta-discussion sprawl AND out-of-lane code shipping.
      This is the bound on both.
    seeds:
      - from: scoping
        kinds: [adr, story]
      - from: composition
        kinds: [feature]
      - from: contract-negotiation
        kinds: [contract_note]
        where:
          state: agreed
        fallback: any

  # ---------------------------------------------------------------------
  # M5 is implementation, but the closure criterion is "Hatter's tests
  # pass" — different from canonical M4's "code shipped against
  # contracts". Tweedles iterate until red→green.
  # ---------------------------------------------------------------------
  - id: implementation
    label: M5
    goal: implement to make Hatter's failing tests pass (red → green)
    roster: [tweedledee, tweedledum]
    meeting_budget: 1.20
    convenor_directive: |
      Implementation thread. Hatter shipped failing tests in the
      prior thread — read them via `read_file` (look in tests/) so
      you know the closure criterion. Your move is `implementation`.
      **Call `write_file` to ship production code** that turns
      Hatter's red tests green.

      The cycle is red → green → refactor. You're in the green step.
      Don't refactor Hatter's tests; if a test is wrong, raise a
      `concern` — but default assumption is the tests describe
      correct behavior.

      **The codebase ALREADY EXISTS in the working tree** — the
      project skeleton is laid down before the run.

      **MANDATORY first move: call `list_files` on the project root
      before any `write_file`.** The skeleton's directory layout is
      authoritative — do NOT invent new top-level directories. If
      the skeleton has `frontend/src/`, frontend code goes there;
      do not create `src/frontend/`. If it has `src/backend/`, backend
      code goes there; do not create `backend/`. New files extend
      the existing tree, never replace it.

      After `list_files`, use `read_file` on the key files in your
      domain (frontend → `frontend/src/App.tsx`, `frontend/src/api.ts`;
      backend → `src/backend/models.py`, `src/backend/api/`) to
      understand the conventions before writing.

      **Skeleton TEMPLATE markers — read carefully.** The skeleton
      ships with a working hello-world example (HelloMessage model,
      /api/messages endpoint, test_messages.py). These files are
      marked at the top with `SKELETON TEMPLATE — REPLACE OR
      DELETE` comment blocks. They exist so the human verifying
      the skeleton has a runnable end-to-end flow before any real
      work happens.

      When you replace template content, the deletion has to be
      *consistent across all files that reference the deleted
      symbols*. The HelloMessage chain is: models.py defines it →
      api/messages.py imports it → api/__init__.py imports the
      router → tests/test_messages.py exercises the endpoint. Half-
      replacement breaks the import chain — pytest fails to collect
      ANY tests because conftest.py imports the broken chain, and
      all your real test signal disappears. Each TEMPLATE comment
      block names exactly which other files need updating; follow
      the instruction.

      Tweedledee owns frontend; Tweedledum owns backend.

      **Iterate red→green using `run_tests`.** This is the load-bearing
      loop for M5: ship code with `write_file`, run the relevant tests
      with `run_tests` (scope to the test file you just touched —
      faster than running everything), read what's still failing, fix
      and repeat. Without this loop you ship blind and the bugs
      surface in M6 review (slower and more expensive). The result
      string from `run_tests` tells you exactly what's red and why.

      **If `run_tests` reports `BUILD FAILURE` (collection error /
      import error), STOP shipping new code and fix the import chain
      first.** A build failure hides ALL test signal — every other
      test in the project becomes invisible. Common cause: you
      replaced or deleted a file that's still being imported
      elsewhere (typically api/__init__.py importing a removed
      router, or tests/ importing a removed model class). Read the
      offending file the error names, remove the stale import, run
      tests again to confirm. Don't keep shipping over a broken
      build — you'll just keep accumulating broken state.

      Use `paths=['tests/test_feature_001_<topic>.py']` to scope to
      the feature you're working on. Run the full suite occasionally
      to catch cross-feature regressions but don't make it your
      default — the full suite is slower and produces more output
      than you can productively read.

      A test that passes when it should fail, or fails when it should
      pass, is a `concern` to raise — don't silently change the test.

      Closure: every test from M4 — Alice's user-journey scenarios
      AND Hatter's failure-mode scenarios — has matching production
      code. The `run_tests` summary line is the literal signal of
      done: when it reports zero failures (or only the failures you
      and the team have explicitly accepted as known limits of the
      v1 scaffold), you're done.
    seeds:
      - from: scoping
        kinds: [adr]
      - from: composition
        kinds: [feature]
      - from: contract-negotiation
        kinds: [contract_note]
        where:
          state: agreed
        fallback: any
      - from: test-scenarios
        kinds: [test_scenario, story]

  # ---------------------------------------------------------------------
  # M6 is review — Caterpillar reviews the IMPLEMENTATION (not the
  # tests, those are Hatter's). Same shape as canonical's review
  # meeting.
  # ---------------------------------------------------------------------
  - id: review
    label: M6
    name: The Trial
    goal: Caterpillar reviews the shipped code; surface findings
    roster: [caterpillar, tweedledee, tweedledum]
    meeting_budget: 1.20
    convenor_directive: |
      Review thread. Code was shipped in a prior implementation
      thread to make Hatter's tests pass. Caterpillar: the working
      tree IS the implementation artifact — call `git_status` to see
      what shipped, then `git_diff` to read the changes. Surface
      findings on the production code itself, citing files and
      lines.

      The features in your context are the user-facing claims the
      shipped code is supposed to deliver. Two layers of review
      land naturally on you:
      - **Per-feature claim integrity** — for each feature, does
        the shipped code actually deliver what the feature claims?
        Apply your "what does this code claim, and does the claim
        hold?" stance with the feature's user-facing promise as the
        anchor. This is the system-wide-invariants check M4 was
        scoped *not* to do (M4 stays per-feature; you generalize).
      - **Implementation correctness** — bugs at the file/line
        level: imports that don't resolve, contracts that aren't
        honored, error paths that swallow data.

      You can also `read_file` Hatter's tests if a finding hinges on
      whether the code matches test intent — but don't critique
      Hatter's tests themselves; that's not in scope.

      Tweedles: respond to findings; if a finding implies a code
      change you agree with, ship the fix via `write_file` and
      re-emit an `implementation` utterance. Do not re-litigate the
      contracts or the tests; both are locked.

      **Bound your fix-on-review work to genuinely-broken bugs.**
      Don't accept every finding as actionable. If Caterpillar's
      finding is a refactor suggestion or "could be improved" —
      not a name-the-broken-behavior bug — push back as a
      `concern` rather than shipping the refactor. M6's job is
      *closure on named bugs*, not perfection. Speculative
      refactors during review are scope creep. (Per analysis 029
      F5's pattern: bound the iteration, ship what's load-bearing,
      let the rest go to a future pass.)
    seeds:
      - from: composition
        kinds: [feature]
      - from: implementation
        kinds: [implementation]
category: legacy
