language: python+javascript

stack:
  runtime: web
  language: python+typescript
  ui_framework: react
  storage: sqlite
  test_framework: pytest+vitest

entry_point: src/backend/main.py

post_apply:
  - description: Install Python backend dependencies (FastAPI + pytest)
    command: pip install -e .[dev]
    cwd: .
  - description: Install Node frontend dependencies (React + Vite)
    command: npm install
    cwd: frontend
