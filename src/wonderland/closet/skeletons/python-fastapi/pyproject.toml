[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.0.1"
description = "FastAPI backend — extend the team"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

# Dev deps live under [dependency-groups] (PEP 735) so ``uv sync``
# installs them automatically into the project venv — keeps
# ``uv run pytest`` from falling back to a tool-cache pytest that
# can't see fastapi/uvicorn.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
