[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.0.1"
description = "Click-based CLI app — extend the team"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

# Dev deps live under [dependency-groups] (PEP 735) so ``uv sync``
# installs them automatically into the project venv — keeps
# ``uv run pytest`` from falling back to a tool-cache pytest that
# can't see click.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
app = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
