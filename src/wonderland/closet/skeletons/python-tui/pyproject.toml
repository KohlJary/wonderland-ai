[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.0.1"
description = "Textual-based TUI app — extend the team"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
]

# Dev deps live under [dependency-groups] (PEP 735) rather than
# [project.optional-dependencies] so ``uv sync`` installs them
# automatically into the project venv. Without this, ``uv run
# pytest`` falls back to a tool-cache pytest that can't see the
# project's runtime deps (e.g. textual) and tests fail to collect
# with "ModuleNotFoundError: No module named 'textual'".
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
app = "src.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
