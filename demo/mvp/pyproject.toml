[project]
name = "fullstack-app"
version = "0.1.0"
description = "Fullstack starter — FastAPI + SQLAlchemy + SQLite + React + Vite. Wonderland scaffolding template."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
]

# Dev deps live under [dependency-groups] (PEP 735) so ``uv sync``
# installs them automatically into the project venv — keeps
# ``uv run pytest`` from falling back to a tool-cache pytest that
# can't see fastapi/sqlalchemy/etc.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
